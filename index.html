    if(r){ applySetting(r.dataset.rng, parseInt(r.value, 10)); syncSettings(o); }
  });
}

/* ===== Event wiring ===== */
function wireReaderEvents(){
  const fs = document.getElementById('fsReader');
  if(!fs) return;
  if(fs.dataset.bound === '1') return;
  fs.dataset.bound = '1';

  let zoneTapTimer=null, zoneLastTap=0;
  fs.querySelectorAll('.fs-zone').forEach(z => {
    z.addEventListener('click', () => {
      if(Date.now() - lastSwipeTime < 400) return;
      const m = currentManga(); if(!m) return;
      const zone = z.dataset.zone;
      const now = Date.now();
      /* Zoomed in: side taps never turn pages; a double-tap zooms back out. */
      if(zoomState.scale>1){
        if(now-zoneLastTap<300){zoneLastTap=0;setZoom(1);} else zoneLastTap=now;
        return;
      }
      /* Left/right zones turn the page immediately (no double-tap wait). */
      if(zone === 'l' || zone === 'r'){
        const rtl = m.readingDirection !== 'ltr';
        goPage(((zone === 'l') === rtl) ? 1 : -1);
        return;
      }
      /* Middle zone: double-tap zooms in, single tap toggles the UI. */
      if(now-zoneLastTap<280){clearTimeout(zoneTapTimer);zoneTapTimer=null;zoneLastTap=0;setZoom(2);return;}
      zoneLastTap=now;
      zoneTapTimer=setTimeout(()=>{
        zoneLastTap=0;zoneTapTimer=null;
        if(zoomState.scale>1) return;
        middleTap();
      },280);
    });
  });

  let touchStartX = 0, touchStartY = 0, touchStartT = 0, zoomedAtTouchStart = false;
  const stage = document.getElementById('fsStage');
  const pts=zoomState.pointers;
  stage.addEventListener('pointerdown',e=>{
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){const a=[...pts.values()];zoomState.startDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);zoomState.startScale=zoomState.scale;}
  });
  stage.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return; const prev=pts.get(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){const a=[...pts.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(zoomState.startDist>0)setZoom(zoomState.startScale*d/zoomState.startDist);}
    else if(zoomState.scale>1){zoomState.x+=e.clientX-prev.x;zoomState.y+=e.clientY-prev.y;applyZoom();}
  });
  const endPointer=e=>{pts.delete(e.pointerId);if(pts.size<2)zoomState.startDist=0;};
  stage.addEventListener('pointerup',endPointer);stage.addEventListener('pointercancel',endPointer);
  stage.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')endPointer(e);});
  stage.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();setZoom(zoomState.scale+(e.deltaY<0?.15:-.15));},{passive:false});
  stage.addEventListener('touchstart', e => {
    if(e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchStartT = Date.now();
    zoomedAtTouchStart = zoomState.scale > 1;
  }, {passive: true});
  stage.addEventListener('touchend', e => {
    if(isStrip()) return;
    if(zoomedAtTouchStart || zoomState.scale > 1) return;
    if(e.changedTouches.length !== 1) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const dt = Date.now() - touchStartT;
    if(dt > 600) return;
    if(Math.abs(dx) < 40) return;
    if(Math.abs(dx) < Math.abs(dy) * 1.2) return;
    const m = currentManga();
    if(!m) return;
    const rtl = m.readingDirection !== 'ltr';
    lastSwipeTime = Date.now();
    if(rtl){
      if(dx > 0) goPage(1); else goPage(-1);
    } else {
      if(dx > 0) goPage(-1); else goPage(1);
    }
  }, {passive: true});

  document.getElementById('fsPrev')?.addEventListener('click', () => {
    const m = currentManga(); if(!m) return;
    if(isStrip()){ stripScrollPage(-1); return; }
    const rtl = m.readingDirection !== 'ltr';
    goPage(rtl ? -1 : 1);
  });
  document.getElementById('fsNext')?.addEventListener('click', () => {
    const m = currentManga(); if(!m) return;
    if(isStrip()){ stripScrollPage(1); return; }
    const rtl = m.readingDirection !== 'ltr';
    goPage(rtl ? 1 : -1);
  });
  document.getElementById('fsPlay')?.addEventListener('click', toggleAuto);
  document.getElementById('fsJump')?.addEventListener('click', openJumpMenu);
  const meta=document.getElementById('fsMeta'); if(meta){let hold;meta.addEventListener('pointerdown',()=>{hold=setTimeout(jumpToPagePrompt,650);});['pointerup','pointerleave','pointercancel'].forEach(k=>meta.addEventListener(k,()=>clearTimeout(hold)));}
  document.getElementById('fsSettings')?.addEventListener('click', openSettingsModal);
  document.getElementById('fsFit')?.addEventListener('click', cycleFitMode);
  document.getElementById('fsDrawerBtn')?.addEventListener('click', () => {
    readerUI.drawerOpen = !readerUI.drawerOpen;
    updateReaderChrome();
  });
  document.getElementById('fsDrawerClose')?.addEventListener('click', () => {
    readerUI.drawerOpen = false;
    updateReaderChrome();
  });
  document.getElementById('fsFullscreen')?.addEventListener('click', async () => {
    try{
      if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    }catch(e){}
  });
  const bookmark = () => {
    const m = currentManga();
    if(!m) return;
    m.bookmarks.unshift({v:m.volume, ch:m.chapter, p:m.page, t:Date.now()});
    if(m.bookmarks.length > 10) m.bookmarks.length = 10;
    save();
    showToastText('🔖 Bookmarked');
  };
  document.getElementById('fsBookmark')?.addEventListener('click', bookmark);
  document.getElementById('fsBookmark2')?.addEventListener('click', bookmark);
  document.getElementById('fsExit')?.addEventListener('click', () => setView('library'));
  fs.querySelectorAll('[data-fctab]').forEach(b => {
    b.addEventListener('click', () => {
      readerUI.counterTab = b.dataset.fctab;
      renderReader();
    });
  });
  fs.querySelectorAll('[data-fc]').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      const id = b.dataset.id;
      const act = b.dataset.fc;
      if(act === 'plus')   quickCount(id, e.shiftKey || false);
      else if(act === 'minus') decrementCounter(id);
      else if(act === 'note')  openNoteModal(id, false);
      const m = currentManga();
      statsMap = computeStats(m);
      fs.querySelectorAll('.fs-counter').forEach(el => {
        const cid = el.dataset.id;
        const s = statsMap[cid] || { story:0, cover:0 };
        const t = el.querySelector('.fc-total');
        if(t) t.textContent = `${s.story} story · ${s.cover} cover`;
      });
    });
  });
}

function renderMain(){
  if(state.view === 'library')       renderLibrary();
  else if(state.view === 'counter')  renderCounter();
  else if(state.view === 'stats')    renderStats();
  else if(state.view === 'reader')   renderReader();
}

function addEvent(cid, isCover, note, silent){
  const m = currentManga();
  if(!m) return;
  const ev = { cid, v: m.volume, ch: m.chapter, p: m.page,
    c: isCover ? 1 : 0, t: Date.now() };
  if(note) ev.n = note;
  m.events.push(ev);
  save();
  if(!silent) showToast(cid, isCover, m);
  if(state.view === 'reader') renderReaderPinned();
  if(state.view === 'counter'){
    statsMap = computeStats(m);
    lastSeenMap = computeLastSeen(m);
    refreshCounterCard(cid);
  }
}
function quickCount(cid, isCover){ addEvent(cid, isCover, null, false); }
function decrementCounter(cid){
  const m = currentManga();
  if(!m) return;
  for(let i = m.events.length - 1; i >= 0; i--){
    if(m.events[i].cid === cid){
      m.events.splice(i, 1);
      save();
      if(state.view === 'counter') renderCounter();
      if(state.view === 'reader') renderReaderPinned();
      return;
    }
  }
}
function undoLast(){
  const m = currentManga();
  if(!m) return;
  if(m.events.length){
    m.events.pop();
    save();
    if(state.view === 'counter') renderCounter();
    if(state.view === 'stats') renderStats();
    if(state.view === 'reader') renderReaderPinned();
  }
}
function refreshCounterCard(cid){
  const m = currentManga();
  const card = document.querySelector(`.card[data-id="${cid}"]`);
  if(!card) return;
  const s = statsMap[cid];
  const totalEl = card.querySelector('.total');
  const [storyChip, coverChip] = card.querySelectorAll('.chip');
  const lastEl = card.querySelector('.lastseen');
  if(totalEl) totalEl.textContent = s.story + s.cover;
  if(storyChip) storyChip.textContent = `${s.story} story`;
  if(coverChip) coverChip.textContent = `${s.cover} cover`;
  if(lastEl){
    const last = lastSeenMap[cid];
    lastEl.innerHTML = last
      ? `Last seen: <b>Vol ${last.v} · Ch ${last.ch || 1} · p. ${last.p}</b>`
      : `<span class="dim">Not seen yet</span>`;
  }
  if(totalEl){
    totalEl.classList.remove('pop'); void totalEl.offsetWidth;
    totalEl.classList.add('pop');
  }
  card.classList.remove('flash'); void card.offsetWidth;
  card.classList.add('flash');
}

async function pickFolderAndBuildDraft(){
  try{
    const handle = await window.showDirectoryPicker({ mode: 'read' });
    showToastText('Scanning folder…');
    const { volumes, coverKey, totalPages } = await scanFolderHandle(handle);
    if(!volumes.length){ alert('No image files found.'); return; }
    draft = {
      kind: 'folder', handle,
      folderName: handle.name,
      title: guessTitleFromFolder(handle.name),
      volumes, coverKey, totalPages
    };
    openReorgModal();
  }catch(e){
    if(e.name !== 'AbortError') console.warn(e);
  }
}
async function scanFolderHandle(handle){
  const allFiles = [];
  async function walk(dir, prefix){
    for await (const [name, entry] of dir.entries()){
      if(entry.kind === 'file' && isImage(name)){
        allFiles.push({ path: [...prefix, name], name });
      } else if(entry.kind === 'directory'){
        await walk(entry, [...prefix, name]);
      }
    }
  }
  await walk(handle, [handle.name]);
  if(!allFiles.length) return { volumes: [], coverKey: null, totalPages: 0 };

  /* Group by immediate parent folder */
  const byParent = new Map();
  for(const f of allFiles){
    const rel = f.path.slice(1);
    const parentParts = rel.slice(0, -1);
    const parentKey = parentParts.join('/');
    if(!byParent.has(parentKey)) byParent.set(parentKey, { parentParts, files: [] });
    byParent.get(parentKey).files.push(f);
  }

  /* For each parent group, decide whether it's a chapter or a volume:
     - If parseChapterFolder returns BOTH vol and ch => it's a chapter folder
     - If it returns only vol (no ch) => it's a volume folder with one implicit chapter
     - If it returns neither => treat as loose images, vol 1 ch 1
     Edge case: chapter folder name has "ch" but no "vol" — use parent folder for vol */
  const volumesMap = new Map();
  let implicitVol = 1;

  for(const [parentKey, group] of byParent){
    const folderName = group.parentParts.length
      ? group.parentParts[group.parentParts.length - 1] : '';

    let volNum = null, chNum = null, chName = '';
    const meta = parseChapterFolder(folderName);
    if(meta.vol !== null) volNum = meta.vol;
    if(meta.ch !== null) chNum = meta.ch;
    if(meta.name) chName = meta.name;

    /* If no volume in this folder name, look up the parent chain */
    if(volNum === null){
      for(let i = group.parentParts.length - 2; i >= 0; i--){
        const v = parseVolNum(group.parentParts[i]);
        if(v !== null){ volNum = v; break; }
      }
    }

    if(volNum === null) volNum = implicitVol;
    if(chNum === null) chNum = 1;

    group.files.sort((a, b) => {
      const pa = parsePageNum(a.name), pb = parsePageNum(b.name);
      if(pa !== pb) return pa - pb;
      return a.name.localeCompare(b.name, undefined, { numeric: true });
    });

    if(!volumesMap.has(volNum)) volumesMap.set(volNum, { num: volNum, chapters: [] });
    const v = volumesMap.get(volNum);
    v.chapters.push({
      num: chNum,
      name: chName || null,
      pageCount: group.files.length,
      keys: group.files.map(f => f.path.join('/')),
    });
  }

  const volumes = [...volumesMap.values()].sort((a, b) => a.num - b.num);
  for(const v of volumes){
    const byCh = new Map();
    for(const ch of v.chapters){
      if(byCh.has(ch.num)){
        const ex = byCh.get(ch.num);
        ex.keys = ex.keys.concat(ch.keys);
        ex.pageCount = ex.keys.length;
        if(!ex.name && ch.name) ex.name = ch.name;
      } else byCh.set(ch.num, { ...ch, keys: ch.keys.slice() });
    }
    v.chapters = [...byCh.values()].sort((a, b) => a.num - b.num);
    for(const ch of v.chapters){
      ch.keys.sort((a, b) => {
        const an = a.split('/').pop(), bn = b.split('/').pop();
        const pa = parsePageNum(an), pb = parsePageNum(bn);
        if(pa !== pb) return pa - pb;
        return an.localeCompare(bn, undefined, { numeric: true });
      });
    }
  }
  const totalPages = volumes.reduce((s, v) =>
    s + v.chapters.reduce((cs, c) => cs + c.pageCount, 0), 0);
  const coverKey = volumes[0]?.chapters[0]?.keys[0] || null;
  return { volumes, coverKey, totalPages };
}
function guessTitleFromFolder(name){
  let s = String(name).replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
  s = s.replace(/\s*[-–]\s*(?:ch|vol).*$/i, '').trim();
  s = s.replace(/\s+vol\s+\d+.*$/i, '').trim();
  return s || 'New manga';
}
async function pickCbzAndBuildDraft(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.cbz,.zip,application/zip,application/x-cbz';
  input.multiple = true;
  input.onchange = async () => {
    const files = Array.from(input.files || []);
    if(!files.length) return;
    try{
      showToastText('Reading CBZ…');
      const all = [];
      for(const file of files){
        const parsed = await parseCbz(file);
        all.push(...parsed);
      }
      const merged = mergeVolumes(all);
      if(!merged.length){ alert('No images found.'); return; }
      const totalPages = merged.reduce((s, v) =>
        s + v.chapters.reduce((cs, c) => cs + c.pageCount, 0), 0);
      const estBytes = files.reduce((s, f) => s + f.size, 0);
      draft = {
        kind: 'cbz',
        title: guessTitleFromFilename(files[0].name),
        volumes: merged, totalPages, estBytes
      };
      openReorgModal();
    }catch(e){
      console.warn(e);
      alert('Could not read CBZ: ' + e.message);
    }
  };
  input.click();
}
async function parseCbz(file){
  const buffer = await file.arrayBuffer();
  const entries = await unzip(buffer);
  const byParent = new Map();
  for(const e of entries){
    if(e.dir || !isImage(e.name)) continue;
    const parts = e.name.split('/').filter(Boolean);
    if(!parts.length) continue;
    const fileName = parts.pop();
    const parentKey = parts.join('/');
    if(!byParent.has(parentKey)) byParent.set(parentKey, { parentParts: parts, files: [] });
    byParent.get(parentKey).files.push({ name: fileName, data: e.data });
  }
  const volumesMap = new Map();
  let implicitVol = 1;
  for(const [parentKey, group] of byParent){
    const folderName = group.parentParts.length
      ? group.parentParts[group.parentParts.length - 1] : '';
    let volNum = null, chNum = null, chName = '';
    const meta = parseChapterFolder(folderName);
    if(meta.vol !== null) volNum = meta.vol;
    if(meta.ch !== null) chNum = meta.ch;
    if(meta.name) chName = meta.name;
    /* fall back to the CBZ file name, e.g. "... vol 001  ch 002 Kiss.cbz" */
    {
      const fm = parseChapterFolder(file.name);
      if(volNum === null && fm.vol !== null) volNum = fm.vol;
      if(chNum === null && fm.ch !== null) chNum = fm.ch;
      if(!chName && fm.name) chName = fm.name;
    }
    if(volNum === null){
      for(let i = group.parentParts.length - 2; i >= 0; i--){
        const v = parseVolNum(group.parentParts[i]);
        if(v !== null){ volNum = v; break; }
      }
    }
    if(volNum === null) volNum = implicitVol;
    if(chNum === null) chNum = 1;
    group.files.sort((a, b) => {
      const pa = parsePageNum(a.name), pb = parsePageNum(b.name);
      if(pa !== pb) return pa - pb;
      return a.name.localeCompare(b.name, undefined, { numeric: true });
    });
    if(!volumesMap.has(volNum)) volumesMap.set(volNum, { num: volNum, chapters: [] });
    volumesMap.get(volNum).chapters.push({
      num: chNum, name: chName || null,
      pageCount: group.files.length, _files: group.files, _src: file.name
    });
  }
  const volumes = [...volumesMap.values()].sort((a, b) => a.num - b.num);
  for(const v of volumes){
    const byCh = new Map();
    for(const ch of v.chapters){
      if(byCh.has(ch.num)){
        const ex = byCh.get(ch.num);
        ex._files = ex._files.concat(ch._files);
        ex.pageCount = ex._files.length;
        if(!ex.name && ch.name) ex.name = ch.name;
      } else byCh.set(ch.num, { ...ch });
    }
    v.chapters = [...byCh.values()].sort((a, b) => a.num - b.num);
    for(const ch of v.chapters){
      ch._files.sort((a, b) => {
        const pa = parsePageNum(a.name), pb = parsePageNum(b.name);
        if(pa !== pb) return pa - pb;
        return a.name.localeCompare(b.name, undefined, { numeric: true });
      });
    }
  }
  return volumes;
}
function mergeVolumes(volumesList){
  const map = new Map();
  for(const v of volumesList){
    if(!map.has(v.num)) map.set(v.num, { num: v.num, chapters: [] });
    const target = map.get(v.num);
    for(const ch of v.chapters){
      const existing=target.chapters.find(x=>Number(x.num)===Number(ch.num));
      if(existing && Array.isArray(existing._files) && Array.isArray(ch._files)){
        existing._files.push(...ch._files); existing.pageCount=existing._files.length;
        if(!existing.name && ch.name) existing.name=ch.name;
      } else if(existing){
        // Keep a unique decimal chapter slot rather than silently overwriting a duplicate.
        let n=Number(ch.num), bump=1; while(target.chapters.some(x=>Number(x.num)===n)) n=Number(ch.num)+bump++/10;
        target.chapters.push({...ch,num:Number(n.toFixed(3))});
      } else target.chapters.push({...ch});
    }
  }
  for(const v of map.values()){
    v.chapters.sort((a,b)=>a.num-b.num);
    v.chapters.forEach(ch=>{if(Array.isArray(ch._files)){ch._files.sort((a,b)=>{const pa=parsePageNum(a.name),pb=parsePageNum(b.name);if(pa!==pb)return pa-pb;return a.name.localeCompare(b.name,undefined,{numeric:true});});ch.pageCount=ch._files.length;}});
  }
  return [...map.values()].sort((a,b) => a.num - b.num);
}
async function pickImagesAndBuildDraft(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.multiple = true;
  if(!IS_MOBILE && 'webkitdirectory' in input) input.webkitdirectory = true;

      kind: 'images',

      totalPages: files.length, estBytes: totalBytes
    };
    openReorgModal();
  };
  input.click();
}
function isImage(name){ return /\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(name); }
function guessTitleFromFilename(name){
  let s = name.replace(/\.(cbz|zip)$/i, '');
  s = s.replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
  s = s.replace(/\b(vol|volume|ch|chapter)\.?\s*\d+.*$/i, '').trim();
  return s || 'New manga';
}
function openReorgModal(){
  const m = draft;
  document.getElementById('reorgTitleInput').value = m.title;
  const info = document.getElementById('reorgInfo');
  const warn = document.getElementById('reorgWarn');
  const totalChapters = m.volumes.reduce((s,v) => s + v.chapters.length, 0);
  info.innerHTML = `<b>${esc(m.title)}</b> — ${m.volumes.length} vol, ${totalChapters} ch, ${m.totalPages} pages`;
  if(m.kind === 'cbz' && m.estBytes) info.innerHTML += `<br><span class="dim">Upload: ${fmtBytes(m.estBytes)}</span>`;
  /* No upload size cap. Large imports just get a heads-up. */
  if(m.kind !== 'folder' && m.estBytes > 1024*1024*1024){
    warn.style.display = 'block';
    warn.textContent = `Large upload (${fmtBytes(m.estBytes)}). Saving may take a while, so keep this tab open until it finishes.`;
  } else warn.style.display = 'none';
  const tree = document.getElementById('reorgTree');
  tree.innerHTML = m.volumes.map((v, vi) => {
    const chs = v.chapters.map((ch, ci) =>
      `<div class="node" style="margin-left:12px">
        <span class="n">Ch</span>
        <input data-v="${vi}" data-c="${ci}" value="${ch.num}" style="width:44px">
        <input class="chname" data-v="${vi}" data-c="${ci}" value="${esc(ch.name || '')}" title="${esc(ch._src || '')}"
               placeholder="chapter name">
        <span class="n">${ch.pageCount}p</span>
      </div>`
    ).join('');
    return `<div class="node">
      <span class="n">Vol</span>
      <input class="volnum" data-v="${vi}" value="${v.num}">
      <span class="n">${v.chapters.length} ch</span>
    </div>${chs}`;
  }).join('');
  document.getElementById('reorgModal').classList.add('show');
}

async function saveReorg(){
  if(!draft) return;
  document.querySelectorAll('#reorgTree .volnum').forEach(inp => {
    const vi = parseInt(inp.dataset.v, 10);
    const n = parseFloat(inp.value);
    if(!isNaN(n) && draft.volumes[vi]) draft.volumes[vi].num = n;
  });
  document.querySelectorAll('#reorgTree input[data-c]:not(.chname)').forEach(inp => {
    const vi = parseInt(inp.dataset.v, 10);
    const ci = parseInt(inp.dataset.c, 10);
    const n = parseFloat(inp.value);
    if(!isNaN(n) && draft.volumes[vi]?.chapters[ci]) draft.volumes[vi].chapters[ci].num = n;
  });
  document.querySelectorAll('#reorgTree .chname').forEach(inp => {
    const vi = parseInt(inp.dataset.v, 10);
    const ci = parseInt(inp.dataset.c, 10);
    if(draft.volumes[vi]?.chapters[ci])
      draft.volumes[vi].chapters[ci].name = inp.value.trim() || null;
  });
  draft.volumes.sort((a,b) => a.num - b.num);
  draft.volumes.forEach(v => v.chapters.sort((a,b) => a.num - b.num));
  const titleInput = document.getElementById('reorgTitleInput').value.trim();
  if(!titleInput){ alert('Please enter a title.'); return; }
  const manga = emptyManga(titleInput);
  if(draft.kind === 'folder'){
    manga.sourceType = 'folder';
    manga.folderName = draft.folderName;
    manga.volumes = draft.volumes.map(v => ({
      num: v.num,
      chapters: v.chapters.map(c => ({
        num: c.num, name: c.name || null, pageCount: c.pageCount,
        keys: c.keys ? c.keys.slice() : []
      }))
    }));
    manga.coverKey = draft.coverKey || null;
    folderHandleCache[manga.id] = draft.handle;
    try{ await idbPut('handle:' + manga.id, draft.handle); }catch(e){}
  } else if(draft.kind === 'cbz'){
    manga.sourceType = 'uploaded';
    const newVolumes = [];
    for(const v of draft.volumes){
      const chapters = [];
      for(const ch of v.chapters){
        const keys = [];
        let fileIndex=0;
        for(const f of ch._files){
          const key = `${manga.id}/${v.num}/${ch.num}/${String(fileIndex++).padStart(5,'0')}_${f.name}`;
          await idbPut(key, new Blob([f.data], { type: imageMime(f.name) }));
          keys.push(key);
        }
        chapters.push({ num: ch.num, name: ch.name || null, pageCount: keys.length, keys });
      }
      newVolumes.push({ num: v.num, chapters });
    }
    manga.volumes = newVolumes;
    manga.coverKey = newVolumes[0]?.chapters[0]?.keys[0] || null;
  } else if(draft.kind === 'images'){
    manga.sourceType = 'uploaded';
    const ch = draft.volumes[0].chapters[0];
    const keys = [];
    for(const f of ch._files){
      const key = `${manga.id}/1/1/${f.name}`;
      await idbPut(key, new Blob([f.file], { type: imageMime(f.name) }));
      keys.push(key);
    }
    manga.volumes = [{ num: 1, chapters: [{ num: 1, name: null, pageCount: keys.length, keys }] }];
    manga.coverKey = keys[0] || null;
  }
  state.mangas.push(manga);
  state.currentMangaId = manga.id;
  save();
  closeReorgModal();
  renderLibrary();
  showToastText(`✅ Added "${esc(manga.title)}"`);
}
function imageMime(name){
  if(/\.jpe?g$/i.test(name)) return 'image/jpeg';
  if(/\.png$/i.test(name)) return 'image/png';
  if(/\.webp$/i.test(name)) return 'image/webp';
  if(/\.gif$/i.test(name)) return 'image/gif';
  if(/\.bmp$/i.test(name)) return 'image/bmp';
  if(/\.avif$/i.test(name)) return 'image/avif';
  return 'application/octet-stream';
}

function addCounterToTab(tab){
  const m = currentManga();
  if(!m) return;
  const name = prompt('Counter name:');
  if(name === null) return;
  const trimmed = name.trim();
  if(!trimmed) return;
  let key = prompt('Keybind (single character):', suggestKey(tab, m.counters));
  if(key === null) return;
  key = key.trim().toLowerCase().slice(0, 1);
  if(!key) return;
  if(m.counters.some(c => c.tab === tab && c.key === key)){
    alert('That key is already used in this tab.'); return;
  }
  if(key >= '1' && key <= '5'){ alert('Digits 1–5 are reserved.'); return; }
  m.counters.push({
    id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    name: trimmed, tab, key
  });
  save();
  renderCounter();
}
function editCounterOfManga(id){
  const m = currentManga();
  const c = m.counters.find(x => x.id === id);
  if(!c) return;
  const name = prompt('Name:', c.name);
  if(name === null) return;
  if(name.trim()) c.name = name.trim();
  const key = prompt('Keybind (single character):', c.key);
  if(key !== null){
    const k = key.trim().toLowerCase().slice(0, 1);
    if(k >= '1' && k <= '5') alert('Digits 1–5 reserved.');
    else if(k && !m.counters.some(o => o.id !== c.id && o.tab === c.tab && o.key === k)) c.key = k;
    else if(k) alert('That key is already used in this tab.');
  }
  save();
  renderCounter();
}

function download(filename, text, type='text/plain'){
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function exportCSV(){

function checkBackupReminder(){
  const now = Date.now();
  if(now - lastBackupCheck < 30000) return;
  lastBackupCheck = now;
  const m = currentManga();
  const banner = document.getElementById('backupBanner');
  if(!banner || !m || !m.events.length) return;
  const last = m.lastExport || 0;
  const newest = m.events.reduce((x, e) => Math.max(x, e.t), 0);
  if(newest <= last){ banner.classList.remove('show'); return; }
  const age = now - last;
  const days = last ? Math.floor(age / 86400000) : null;
  let msg;
  if(!last) msg = `You have <b>${m.events.length}</b> counts but never exported.`;
  else if(age >= 3 * 86400000) msg = `Last export <b>${days}d ago</b> — new counts.`;
  else { banner.classList.remove('show'); return; }
  banner.querySelector('.msg').innerHTML = msg;
  banner.classList.add('show');
}

async function unzip(arrayBuffer){
  const data = new Uint8Array(arrayBuffer);
  const entries = [];
  const decoder = new TextDecoder('utf-8');
  let i = data.length - 22;
  while(i >= 0 && data[i] !== 0x50) i--;
  if(i < 0) throw new Error('Not a zip');
  const eocd = new DataView(arrayBuffer, i);
  const cdSize = eocd.getUint32(12, true);
  const cdOffset = eocd.getUint32(16, true);
  let p = cdOffset;
  const view = new DataView(arrayBuffer);
  while(p < cdOffset + cdSize){
    if(view.getUint32(p, true) !== 0x02014b50) break;
    const method = view.getUint16(p + 10, true);
    const csize = view.getUint32(p + 20, true);
    const nameLen = view.getUint16(p + 28, true);
    const extraLen = view.getUint16(p + 30, true);
    const commentLen = view.getUint16(p + 32, true);
    const localOff = view.getUint32(p + 42, true);
    const name = decoder.decode(data.subarray(p + 46, p + 46 + nameLen));
    const isDir = name.endsWith('/');
    const localNameLen = view.getUint16(localOff + 26, true);
    const localExtraLen = view.getUint16(localOff + 28, true);
    const dataStart = localOff + 30 + localNameLen + localExtraLen;
    let fileData = null;
    if(!isDir){
      const raw = data.subarray(dataStart, dataStart + csize);
      if(method === 0){
        fileData = raw;
      } else if(method === 8){
        const ds = new DecompressionStream('deflate-raw');
        const stream = new Blob([raw]).stream().pipeThrough(ds);
        const ab = await new Response(stream).arrayBuffer();
        fileData = new Uint8Array(ab);
      } else throw new Error('Unsupported compression: ' + method);
    }
    entries.push({ name, dir: isDir, data: fileData });
    p += 46 + nameLen + extraLen + commentLen;
  }
  return entries;
}

/* Keyboard */
document.addEventListener('keydown', e => {
  if(document.querySelector('.modal-overlay.show')) return;
  const t = e.target;
  const tag = (t.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea' || t.isContentEditable) return;
  const m = currentManga();
  if(state.view === 'reader'){
    if(e.key.toLowerCase()==='f'){e.preventDefault();cycleFitMode();return;}
    if(e.key.toLowerCase()==='s'){e.preventDefault();openSettingsModal();return;}
    if(e.key.toLowerCase()==='j'){e.preventDefault();openJumpMenu();return;}
    if(e.key.toLowerCase()==='b'){e.preventDefault();document.getElementById('fsBookmark')?.click();return;}
    if(e.key.toLowerCase()==='d'){e.preventDefault();readerUI.drawerOpen=!readerUI.drawerOpen;updateReaderChrome();return;}
    if(e.key==='+'||e.key==='='){e.preventDefault();setZoom(zoomState.scale+.2);return;}
    if(e.key==='-'){e.preventDefault();setZoom(zoomState.scale-.2);return;}
    if(e.key==='0'){e.preventDefault();resetZoom();return;}
    if(e.key==='Home'){e.preventDefault();const mm=currentManga();if(mm){mm.page=1;save();loadCurrentPage();}return;}
    if(e.key==='End'){e.preventDefault();const mm=currentManga(),cc=mm&&curChapter(mm);if(mm&&cc){mm.page=cc.pageCount||1;save();loadCurrentPage();}return;}
    const rtl = m && m.readingDirection !== 'ltr';
    if(isStrip()){
      if(e.code === 'ArrowDown' || e.code === 'PageDown' || e.code === 'ArrowRight'){ e.preventDefault(); stripScrollPage(1); return; }
      if(e.code === 'ArrowUp' || e.code === 'PageUp' || e.code === 'ArrowLeft'){ e.preventDefault(); stripScrollPage(-1); return; }
    } else {
      if(e.code === 'ArrowLeft'){ e.preventDefault(); goPage(rtl ? 1 : -1); return; }
      if(e.code === 'ArrowRight'){ e.preventDefault(); goPage(rtl ? -1 : 1); return; }
    }
    if(e.code === 'Escape'){ setView('library'); return; }
    if(e.code === 'Space' && !e.altKey && !e.ctrlKey && !e.metaKey){
      e.preventDefault(); goPage(e.shiftKey ? -1 : 1); return;
    }
  }
  if(e.code === 'Space' && !e.altKey && !e.ctrlKey && !e.metaKey){
    e.preventDefault();
    if(!m) return;
    if(e.shiftKey) m.page = Math.max(1, m.page - 1);
    else m.page = m.page + 1;
    save(); renderSubbar();
    if(state.view === 'reader') loadCurrentPage();
    return;
  }
  if(e.key === 'Backspace'){ e.preventDefault(); undoLast(); return; }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); undoLast(); return; }
  if(e.ctrlKey || e.metaKey) return;
  if(!m) return;
  const k = codeToKey(e.code, e.key);
  const counter = counterForKeyInTab(k, state.activeCounterTab, m.counters);
  if(!counter) return;
  if(e.altKey && e.shiftKey){ e.preventDefault(); decrementCounter(counter.id); }
  else if(e.altKey){ e.preventDefault(); openNoteModal(counter.id, false); }
  else { e.preventDefault(); quickCount(counter.id, e.shiftKey); }
});

function handleMainAction(e){
  const btn = e.target.closest('[data-act]');
  if(btn){
    const act = btn.dataset.act;
    if(act === 'addManga'){ addMangaFlow(); return; }
    if(act === 'structure'){ openStructure(btn.dataset.id); return; }
    if(act === 'favoriteManga'){ const mm=state.mangas.find(x=>x.id===btn.dataset.id); if(mm){mm.favorite=!mm.favorite;save();renderLibrary();} return; }
    if(act === 'toggleHideRead'){ libraryHideRead=!libraryHideRead;renderLibrary();return; }
    if(act === 'openManga'){ openManga(btn.dataset.id); return; }
    if(act === 'renameManga'){ renameManga(btn.dataset.id); return; }
    if(act === 'deleteManga'){ deleteManga(btn.dataset.id); return; }
    if(act === 'exportSave'){ exportSave(); return; }
    if(act === 'exportCSV'){ exportCSV(); return; }
    if(act === 'resetCounts'){ resetCounts(); return; }
    if(act === 'dismissBanner'){ const b = document.getElementById('backupBanner'); if(b) b.classList.remove('show'); return; }
    if(act === 'jumpBm'){ const mm = currentManga(); const b = mm.bookmarks[parseInt(btn.dataset.idx,10)]; if(b){ mm.volume=b.v; mm.chapter=b.ch; mm.page=b.p; save(); renderMain(); } return; }
    if(act === 'delBm'){ const mm = currentManga(); mm.bookmarks.splice(parseInt(btn.dataset.idx,10),1); save(); renderStats(); return; }
    if(act === 'openFolder'){ relinkFolder(btn.dataset.id); return; }
    if(act === 'addCounter'){ addCounterToTab(btn.dataset.tab); return; }
    if(act === 'pin'){ togglePinCounter(btn.dataset.id); return; }
    if(act === 'plus'){ quickCount(btn.dataset.id, e.shiftKey); return; }
    if(act === 'minus'){ decrementCounter(btn.dataset.id); return; }
    if(act === 'details'){ openNoteModal(btn.dataset.id, e.shiftKey); return; }
    if(act === 'edit'){ editCounterOfManga(btn.dataset.id); return; }
    if(act === 'delete'){ deleteCounterOfManga(btn.dataset.id); return; }
    if(act === 'setRTL'){ const mm = currentManga(); mm.readingDirection = 'rtl'; rs.strip = false; saveRS(); save(); renderStats(); return; }
    if(act === 'setLTR'){ const mm = currentManga(); mm.readingDirection = 'ltr'; rs.strip = false; saveRS(); save(); renderStats(); return; }
  }
  const chip = e.target.closest('.pinned-chip');
  if(chip){ quickCount(chip.dataset.pinId, false); return; }
  const mangaCard = e.target.closest('.manga-card');
  if(mangaCard && !e.target.closest('button')){ openManga(mangaCard.dataset.id); }
}

document.getElementById('reorgCancel').addEventListener('click', closeReorgModal);
document.getElementById('reorgSave').addEventListener('click', saveReorg);
document.getElementById('noteSkip').addEventListener('click', () => {
  if(!noteState) return;
  const { cid, isCover } = noteState;
  closeNoteModal();
  quickCount(cid, isCover);
});
document.getElementById('noteSave').addEventListener('click', saveNoteModal);
document.getElementById('noteInput').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); saveNoteModal(); }
  if(e.key === 'Escape'){ e.preventDefault(); closeNoteModal(); }
});

window.addEventListener('pagehide', ()=>{ if(activeReadSession){const mm=state.mangas.find(x=>x.id===activeReadSession.mid);if(mm)mm.activeReadingSession=activeReadSession;} flushSave(); });
applyTheme(currentTheme);
setSaveIndicator(false);
document.body.classList.toggle('reading', state.view === 'reader');
document.getElementById('topnav').style.display = state.view === 'reader' ? 'none' : '';
renderTopTabs();
renderSubbar();
renderMain();
setInterval(checkBackupReminder, 60000);
window.addEventListener('resize', () => {
  if(state.view === 'reader') updateReaderChrome();
});
</script>
</body>
</html>
