<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1015">
<link rel="icon" type="image/webp" href="https://i.ibb.co.com/Fq7XY1Rj/148855716-p4-master1200-2.webp">
<link rel="apple-touch-icon" href="https://i.ibb.co.com/Fq7XY1Rj/148855716-p4-master1200-2.webp">
<title>ErlanYomi</title>
<style>
  :root{
    --bg:#0e1015; --panel:#161a22; --panel2:#1d222c; --line:#2a3140;
    --txt:#e7eaf0; --dim:#8a93a6; --accent:#7c9cff;
    --story:#5eead4; --cover:#f0abfc; --danger:#f87171;
    --card-hover:#39445a; --shadow:rgba(124,156,255,.55);
    --radius:14px; --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  [data-theme="pink"]{
    --bg:#fff0f6; --panel:#ffe4ef; --panel2:#ffd6e7; --line:#ffb8d4;
    --txt:#5a1f3d; --dim:#b06a8a; --accent:#ff5fa2;
    --story:#e0457b; --cover:#b44dff; --danger:#e63946;
    --card-hover:#ffb8d4; --shadow:rgba(255,95,162,.45);
  }
  [data-theme="matcha"]{
    --bg:#f2f7ed; --panel:#e6f0da; --panel2:#d8e8c6; --line:#b8d49a;
    --txt:#2d3b1f; --dim:#7a8f63; --accent:#5a9e3a;
    --story:#3d8b5f; --cover:#a8821f; --danger:#c44536;
    --card-hover:#b8d49a; --shadow:rgba(90,158,58,.45);
  }
  [data-theme="sky"]{
    --bg:#eef6ff; --panel:#e0eeff; --panel2:#cfe4ff; --line:#a8ccf5;
    --txt:#1a2e4a; --dim:#5f7fa6; --accent:#2f7fd4;
    --story:#1a8f9e; --cover:#7b5cd6; --danger:#d9484f;
    --card-hover:#a8ccf5; --shadow:rgba(47,127,212,.45);
  }
  [data-theme="vintage"]{
    --bg:#f5efe3; --panel:#ede5d4; --panel2:#e3d8c2; --line:#cdbfa5;
    --txt:#3d3527; --dim:#8a7d65; --accent:#a0682c;
    --story:#5f7a3d; --cover:#9a4d8a; --danger:#b04430;
    --card-hover:#cdbfa5; --shadow:rgba(160,104,44,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--txt);
    font:14px/1.45 var(--font); -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  button{touch-action:manipulation; -webkit-tap-highlight-color:transparent}
  .topnav{
    position:sticky; top:0; z-index:30;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px 16px; background:color-mix(in srgb, var(--bg) 94%, transparent);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  }
  .brand{font-weight:700; letter-spacing:.3px; font-size:15px; margin-right:6px}
  .brand span{color:var(--accent)}
  .viewtabs{display:flex; gap:4px}
  .viewtab{background:transparent; border:1px solid transparent; color:var(--dim);
           padding:8px 14px; border-radius:9px; cursor:pointer; font:inherit;
           font-weight:700; font-size:13px}
  .viewtab:hover{color:var(--txt); background:var(--panel)}
  .viewtab.active{background:var(--panel2); border-color:var(--line); color:var(--txt)}
  .topright{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .btn{background:var(--panel2); border:1px solid var(--line); color:var(--txt);
       padding:8px 12px; border-radius:9px; cursor:pointer; font:inherit; font-weight:600}
  .btn:hover{background:var(--card-hover)}
  .btn.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.danger:hover{background:#3a1d1d; border-color:#5b2b2b; color:#ffb4b4}
  .btn.big{padding:11px 16px; font-size:15px}
  .theme-picker{display:flex; gap:5px; background:var(--panel);
                border:1px solid var(--line); border-radius:10px; padding:3px}
  .swatch{width:22px; height:22px; border-radius:6px; border:2px solid transparent;
          cursor:pointer; padding:0; transition:transform .12s}
  .swatch:hover{transform:scale(1.15)}
  .swatch.active{border-color:var(--accent); box-shadow:0 0 0 2px var(--shadow)}
  .subbar{
    position:sticky; top:57px; z-index:25;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:8px 16px; background:color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  }
  .subbar.hidden{display:none}
  .posgroup{display:flex; gap:8px; flex-wrap:wrap}
  .pos{display:flex; align-items:center; gap:4px; background:var(--panel);
       border:1px solid var(--line); border-radius:10px; padding:3px}
  .pos .lbl{color:var(--dim); font-size:12px; padding:0 5px 0 7px; font-weight:600}
  .pos input{width:50px; background:transparent; border:0; color:var(--txt);
             text-align:center; font:inherit; font-weight:700; outline:none}
  .pos input::-webkit-outer-spin-button,
  .pos input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  .pos input[type=number]{-moz-appearance:textfield}
  .pos button{background:var(--panel2); border:1px solid var(--line); color:var(--txt);
              width:26px; height:26px; border-radius:7px; cursor:pointer;
              font-size:15px; line-height:1; padding:0}
  .pos button:hover{background:var(--card-hover)}
  .subbar .title{font-weight:700; font-size:14px; overflow:hidden;
                 text-overflow:ellipsis; white-space:nowrap; max-width:38vw}
  main{padding:16px; max-width:1400px; margin:0 auto}
  body.reading main{padding:0; max-width:none}
  .lib-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap;
            margin-bottom:14px}
  .lib-head h2{margin:0; font-size:18px; font-weight:800; letter-spacing:.2px}
  .lib-head .grow{flex:1}
  .storage-meter{font-size:12px; color:var(--dim); display:flex; flex-direction:column;
                 gap:4px; min-width:180px}
  .storage-meter .bar{height:6px; background:var(--panel2); border-radius:4px;
                      overflow:hidden; border:1px solid var(--line)}
  .storage-meter .bar > div{height:100%; background:var(--accent); width:0%}
  .storage-meter b{color:var(--txt)}
  .lib-grid{display:grid; gap:14px;
            grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .manga-card{background:var(--panel); border:1px solid var(--line);
              border-radius:14px; overflow:hidden; cursor:pointer;
              display:flex; flex-direction:column;
              transition:border-color .15s, transform .12s}
  @media (hover:hover){.manga-card:hover{border-color:var(--accent); transform:translateY(-2px)}}
  .manga-cover{aspect-ratio:2/3; background:var(--panel2);
               display:flex; align-items:center; justify-content:center;
               color:var(--dim); font-size:11px; text-align:center; overflow:hidden;
               position:relative}
  .manga-cover img{width:100%; height:100%; object-fit:cover}
  .manga-cover .nofile{font-size:11px; padding:8px; line-height:1.5}
  .manga-cover .badge{position:absolute; top:6px; left:6px; background:rgba(0,0,0,.65);
                      color:#fff; font-size:10px; font-weight:700; padding:2px 7px;
                      border-radius:20px}
  .manga-cover .badge.linked{background:rgba(90,158,90,.85)}
  .manga-cover .badge.uploaded{background:rgba(124,156,255,.85)}
  .manga-cover .badge.missing{background:rgba(200,80,80,.85)}
  .manga-body{padding:9px 11px 11px; display:flex; flex-direction:column; gap:5px}
  .manga-title{font-weight:700; font-size:13px; overflow:hidden;
               text-overflow:ellipsis; white-space:nowrap}
  .manga-sub{font-size:11px; color:var(--dim)}
  .manga-progress{height:5px; background:var(--panel2); border-radius:4px;
                  overflow:hidden; border:1px solid var(--line); margin-top:2px}
  .manga-progress > div{height:100%; background:var(--accent)}
  .manga-actions{display:flex; gap:4px; padding:0 11px 11px}
  .manga-actions button{flex:1; background:var(--panel2); border:1px solid var(--line);
                        color:var(--txt); padding:5px; border-radius:7px;
                        cursor:pointer; font:inherit; font-size:11px; font-weight:700}
  .manga-actions button:hover{background:var(--card-hover)}
  .add-manga{border-style:dashed; align-items:center; justify-content:center;
             color:var(--dim); background:transparent; border:1px dashed var(--line);
             border-radius:14px; cursor:pointer; font:inherit; font-weight:600;
             display:flex; flex-direction:column; gap:6px; min-height:260px}
  .add-manga:hover{color:var(--txt); border-color:var(--accent); background:var(--panel)}
  .add-manga .plus{font-size:30px; line-height:1}
  .fs-reader{
    position:fixed; inset:0; z-index:40;
    background:#000; color:#fff; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .fs-stage{
    flex:1; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .fs-stage img{
    max-width:100%; max-height:100%; object-fit:contain;
    user-select:none; -webkit-user-drag:none; pointer-events:none;
  }
  .fs-empty{
    color:#aaa; font-size:13px; text-align:center; padding:30px; line-height:1.7;
    max-width:80%;
  }
  .fs-zone{
    position:absolute; top:0; bottom:0; z-index:5;
    -webkit-tap-highlight-color:transparent;
  }
  .fs-zone.l{left:0; width:33%}
  .fs-zone.r{right:0; width:33%}
  .fs-zone.m{left:33%; right:33%; width:34%}
  .fs-chrome{
    position:absolute; left:0; right:0; z-index:20;
    background:linear-gradient(to bottom, rgba(0,0,0,.85), rgba(0,0,0,.4));
    transition:opacity .18s;
  }
  .fs-chrome.top{ top:0; padding:12px 14px; display:flex;
                  align-items:flex-start; gap:10px; }
  .fs-chrome.bottom{
    bottom:0; padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.4));
    display:flex; align-items:center; gap:10px;
  }
  .fs-chrome.hidden{ opacity:0; pointer-events:none; }
  .fs-top-left{ flex:1; min-width:0 }
  .fs-title{ font-weight:700; font-size:14px; overflow:hidden;
             text-overflow:ellipsis; white-space:nowrap; }
  .fs-meta{ font-size:12px; color:#b0b8cc; margin-top:2px;
            display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .fs-meta .chapter-name{font-style:italic; color:#8ea0c0; font-size:11px;}
  .fs-top-right{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .fs-btn{
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25);
    color:#fff; min-width:38px; height:38px; border-radius:10px;
    cursor:pointer; font-size:16px; display:flex; align-items:center;
    justify-content:center; padding:0 8px;
    -webkit-tap-highlight-color:transparent;
  }
  .fs-btn:hover{ background:rgba(255,255,255,.2); }
  .fs-btn.big{ width:auto; padding:0 14px; font-weight:700; font-size:13px; }
  .fs-progress{
    flex:1; height:6px; background:rgba(255,255,255,.15);
    border-radius:4px; overflow:hidden;
  }
  .fs-progress > div{ height:100%; background:var(--accent); }
  .fs-drawer{
    position:absolute; top:0; right:0; bottom:0; z-index:30;
    width:min(340px,88vw);
    background:var(--panel); border-left:1px solid var(--line);
    transform:translateX(100%); transition:transform .22s ease;
    display:flex; flex-direction:column; color:var(--txt);
    box-shadow:-10px 0 30px rgba(0,0,0,.4);
  }
  .fs-drawer.open{ transform:translateX(0); }
  .fs-drawer-head{
    padding:12px 14px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:8px;
  }
  .fs-drawer-title{ font-weight:800; flex:1; font-size:14px; }
  .fs-drawer-body{
    flex:1; overflow-y:auto; padding:12px 14px;
    -webkit-overflow-scrolling:touch;
  }
  .fs-drawer-foot{
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line); display:flex; gap:8px;
  }
  .fs-counter{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    background:var(--panel2); border:1px solid var(--line);
    border-radius:12px; margin-bottom:8px;
  }
  .fs-counter .fc-body{ flex:1; min-width:0; }
  .fs-counter .fc-name{ font-weight:700; font-size:13px;
                        overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fs-counter .fc-total{ font-size:11px; color:var(--dim); margin-top:2px; }
  .fs-counter .fc-btns{ display:flex; gap:6px; }
  .fs-counter .fc-btns button{
    width:40px; height:40px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--txt); cursor:pointer; font-size:20px;
    font-weight:800; line-height:1; display:flex; align-items:center;
    justify-content:center; -webkit-tap-highlight-color:transparent;
  }
  .fs-counter .fc-btns button.plus{
    background:var(--accent); color:#fff; border-color:var(--accent);
  }
  .fs-counter .fc-btns button:active{ transform:scale(.94); }
  .fc-tabs{ display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .fc-tabs button{
    flex:1; padding:8px; border-radius:9px; border:1px solid var(--line);
    background:var(--bg); color:var(--dim); font-weight:700; font-size:12px;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .fc-tabs button.active{ background:var(--panel2); color:var(--txt); }
  .chapter-list{
    max-height:60vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; gap:4px;
  }
  .chapter-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    background:var(--panel2); border:1px solid var(--line); border-radius:9px;
    cursor:pointer; font-size:13px; -webkit-tap-highlight-color:transparent;
  }
  .chapter-item:hover{ border-color:var(--accent); }
  .chapter-item.current{ border-color:var(--accent);
                         background:color-mix(in srgb, var(--accent) 15%, var(--panel2)); }
  .chapter-item .ci-ch{ font-weight:700; min-width:46px; }
  .chapter-item .ci-name{ flex:1; color:var(--dim); font-style:italic;
                          overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chapter-item .ci-pages{ color:var(--dim); font-size:11px; }
  .chapter-vol-head{ font-weight:800; font-size:13px; padding:10px 4px 4px;
                     color:var(--dim); text-transform:uppercase; letter-spacing:.7px; }
  .tabmeta{display:flex; justify-content:space-between; align-items:center;
           flex-wrap:wrap; gap:8px; margin-bottom:12px;
           font-size:12px; color:var(--dim)}
  .tabmeta b{color:var(--txt); font-weight:700}
  .lastadded{margin:0 0 10px; font-size:12px; color:var(--dim);
             background:var(--panel); border:1px solid var(--line);
             border-radius:9px; padding:7px 12px}
  .lastadded b{color:var(--txt)}
  .grid{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:13px 14px 12px; display:flex; flex-direction:column; gap:9px;
    position:relative;
  }
  .card.pinned{border-color:color-mix(in srgb, var(--accent) 50%, var(--line))}
  .card.add{
    border-style:dashed; color:var(--dim); background:transparent;
    align-items:center; justify-content:center; min-height:158px;
    font:inherit; font-weight:600; text-align:center; cursor:pointer;
  }
  .card.add:hover{color:var(--txt); border-color:var(--accent); background:var(--panel)}
  .card-body-tap{
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .card-head{display:flex; align-items:center; gap:6px}
  .cname{font-weight:700; font-size:14px; flex:1; overflow:hidden;
         text-overflow:ellipsis; white-space:nowrap}
  .icon{background:transparent; border:0; color:var(--dim); cursor:pointer;
        font-size:15px; padding:6px 8px; border-radius:6px; line-height:1;
        min-width:34px; min-height:34px;
        -webkit-tap-highlight-color:transparent;
        display:inline-flex; align-items:center; justify-content:center}
  .icon:hover{background:var(--panel2); color:var(--txt)}
  .icon.danger:hover{color:var(--danger)}
  .icon.star.on{color:var(--accent)}
  .total{font-size:38px; font-weight:800; line-height:1; letter-spacing:-1px}
  .split{display:flex; gap:6px; flex-wrap:wrap}
  .chip{font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px;
        border:1px solid}
  .chip.story{color:var(--story); border-color:color-mix(in srgb, var(--story) 40%, transparent);
              background:color-mix(in srgb, var(--story) 12%, transparent)}
  .chip.cover{color:var(--cover); border-color:color-mix(in srgb, var(--cover) 40%, transparent);
              background:color-mix(in srgb, var(--cover) 12%, transparent)}
  .lastseen{font-size:11px; color:var(--dim); line-height:1.5;
            border-top:1px dashed var(--line); padding-top:7px; margin-top:2px}
  .lastseen b{color:var(--txt); font-weight:700}
  .keyhint{font-size:11px; color:var(--dim); line-height:1.7}
  kbd{background:var(--panel2); border:1px solid var(--line); border-bottom-width:2px;
      border-radius:5px; padding:1px 5px; font:600 11px/1.4 ui-monospace,monospace;
      color:var(--txt)}
  .card-btns{display:flex; gap:6px; margin-top:auto}
  .card-btns button{flex:1; background:var(--panel2); border:1px solid var(--line);
                    color:var(--txt); padding:10px 6px; border-radius:8px; cursor:pointer;
                    font:inherit; font-weight:700; font-size:16px;
                    min-height:40px;
                    -webkit-tap-highlight-color:transparent;
                    touch-action:manipulation}
  .card-btns button:hover{background:var(--card-hover)}
  .card-btns button.plus{background:var(--accent); color:#fff; border-color:var(--accent)}
  .card-btns button:active{transform:scale(.96)}
  .hint{color:var(--dim); font-size:12px; margin:16px 2px 40px}
  h3{font-size:13px; text-transform:uppercase; letter-spacing:.8px;
     color:var(--dim); margin:26px 0 10px; font-weight:700}
  h3:first-child{margin-top:0}
  .tbl{width:100%; border-collapse:collapse; background:var(--panel);
       border:1px solid var(--line); border-radius:12px; overflow:hidden;
       font-size:13px}
  .tbl th{text-align:left; padding:9px 12px; background:var(--panel2);
          color:var(--dim); font-size:11px; text-transform:uppercase;
          letter-spacing:.6px; font-weight:700; white-space:nowrap}
  .tbl td{padding:8px 12px; border-top:1px solid var(--line)}
  .tbl tr.totalrow td{font-weight:800; background:var(--panel2); border-top:2px solid var(--line)}
  .tbl td.num{font-variant-numeric:tabular-nums; font-weight:700}
  .wrap{overflow-x:auto; border-radius:12px}
  .dim{color:var(--dim)}
  .note-text{color:var(--dim); font-style:italic}
  .savebar{display:flex; gap:8px; flex-wrap:wrap; align-items:center;
           background:var(--panel); border:1px solid var(--line);
           border-radius:12px; padding:12px 14px; margin-top:10px}
  .vol-summary{background:var(--panel); border:1px solid var(--line);
               border-radius:12px; padding:16px 18px; margin-bottom:12px}
  .vol-summary h4{margin:0 0 10px; font-size:14px; font-weight:800}
  .vol-summary .vs-grid{display:grid; gap:14px;
                        grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .vol-summary .vs-block{font-size:12px; line-height:1.7}
  .vol-summary .vs-block .vs-title{font-size:11px; text-transform:uppercase;
                                    letter-spacing:.7px; color:var(--dim);
                                    font-weight:700; margin-bottom:4px}
  .vol-summary .vs-block ul{margin:0; padding-left:16px}
  .vol-summary .vs-block b{color:var(--txt)}
  .backup-banner{
    display:none; align-items:center; gap:10px; flex-wrap:wrap;
    background:color-mix(in srgb, var(--accent) 14%, var(--panel));
    border:1px solid color-mix(in srgb, var(--accent) 40%, var(--line));
    border-radius:12px; padding:10px 14px; margin-bottom:14px; font-size:12px;
  }
  .backup-banner.show{display:flex}
  .backup-banner .msg{flex:1; min-width:200px}
  .pinned-bar{
    display:none; gap:8px; flex-wrap:wrap; margin-bottom:14px;
    padding:10px 12px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px;
  }
  .pinned-bar.show{display:flex}
  .pinned-bar .plabel{font-size:11px; font-weight:700; text-transform:uppercase;
                      letter-spacing:.7px; color:var(--dim); align-self:center;
                      margin-right:4px}
  .pinned-chip{
    display:flex; align-items:center; gap:6px;
    background:var(--panel2); border:1px solid var(--line);
    border-radius:9px; padding:6px 10px; font-size:12px; font-weight:600;
    cursor:pointer;
  }
  .pinned-chip .pc-total{font-weight:800; color:var(--accent)}
  .pinned-chip .pc-key{font:600 10px/1 ui-monospace,monospace; color:var(--dim);
                       background:var(--bg); border:1px solid var(--line);
                       border-radius:4px; padding:2px 4px}
  .pinned-chip .pc-star{background:none; border:0; color:var(--accent);

  .modal .choice{display:flex; flex-direction:column; gap:8px}

  .modal .actions{display:flex; justify-content:flex-end; gap:8px; margin-top:4px}
  .modal .tree{background:var(--panel2); border:1px solid var(--line);
               border-radius:10px; padding:10px; max-height:260px; overflow:auto;
               font-size:12px}
  .modal .tree .node{display:flex; align-items:center; gap:6px; padding:3px 0}
  .modal .tree .node input{width:52px; background:var(--bg); border:1px solid var(--line);
                            color:var(--txt); font:inherit; padding:3px 5px;
                            border-radius:4px; text-align:center; font-size:12px}

  .modal .tree .node .n{color:var(--dim); font-size:11px; min-width:14px}
  .modal .warn{background:color-mix(in srgb, var(--danger) 14%, var(--panel));

  .modal .info{background:color-mix(in srgb, var(--accent) 12%, var(--panel));
               border:1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
               border-radius:10px; padding:10px 12px; font-size:12px; line-height:1.6}

  /* Added reader upgrades */
  .save-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6ee7a8;margin-left:4px;vertical-align:middle;box-shadow:0 0 0 2px rgba(110,231,168,.12)}
  .save-dot.pending{background:#fbbf24;box-shadow:0 0 0 2px rgba(251,191,36,.14)}
  .manga-card .manga-progress{position:relative}

  .manga-card .manga-subline{font-size:10px;color:var(--dim);display:flex;justify-content:space-between;gap:5px}
  .lib-favbar{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
  .lib-favbar button{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:9px;padding:7px 10px;font:inherit;font-size:12px;cursor:pointer}

  .progress-ring:after{content:attr(data-pct);width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:var(--panel);font-size:8px;font-weight:800;color:var(--txt)}
  .reader-pinned{position:absolute;z-index:18;left:10px;right:10px;bottom:calc(58px + env(safe-area-inset-bottom));display:flex;gap:6px;overflow-x:auto;padding:6px;pointer-events:auto;scrollbar-width:none}
  .reader-pinned:empty{display:none}
  .reader-pin{flex:0 0 auto;border:1px solid rgba(255,255,255,.28);background:rgba(20,24,32,.88);color:#fff;border-radius:999px;padding:7px 10px;font:700 11px/1.2 system-ui;min-height:34px;touch-action:pan-x;user-select:none}
  .reader-pin b{color:#9db5ff;margin-left:4px}
  .zoom-indicator{position:absolute;z-index:22;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.72);color:white;padding:7px 11px;border-radius:20px;font-weight:700;font-size:12px;pointer-events:none;opacity:0;transition:opacity .15s}
  .zoom-indicator.show{opacity:1}
  .fs-reader[data-fit="width"] .fs-spread:not(.double) img{width:100%;height:auto;max-height:none;max-width:100%;object-fit:contain}
  .fs-reader[data-fit="height"] .fs-spread:not(.double) img{height:100%;width:auto;max-width:100%;max-height:100%;object-fit:contain}
  .fs-reader[data-fit="original"] .fs-spread img{width:auto;height:auto;max-width:none;max-height:none;object-fit:initial}
  .fs-reader[data-fit="page"] .fs-spread img{max-width:100%;max-height:100%;object-fit:contain}
  .jm-search{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:10px 12px;font:inherit;outline:none}
  .chapter-item .read-state{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:2px 6px}
  .chapter-item.is-read .read-state{color:var(--story);border-color:color-mix(in srgb,var(--story) 40%,var(--line))}
  .chapter-item .ci-cover{width:30px;height:40px;object-fit:cover;border-radius:4px;background:var(--bg);display:none}
  .chapter-item.show-cover .ci-cover{display:block}
  .structure-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:9px}
  .structure-thumb{background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:11px}
  .structure-thumb img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover}

  .chapter-transition{position:absolute;z-index:24;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(16,20,28,.94);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:14px 18px;color:#fff;text-align:center;pointer-events:none;animation:chapterPop 1.4s ease both;max-width:85vw}
  @keyframes chapterPop{0%{opacity:0;transform:translate(-50%,-42%)}12%,75%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0}}
  @media(max-width:600px){.reader-pinned{bottom:calc(56px + env(safe-area-inset-bottom));}.manga-actions{flex-wrap:wrap}.manga-actions button{flex:1 1 28%}}

  /* ===== Reader v2: strip, spreads, settings, jump menu ===== */
  .fs-empty{position:relative; z-index:6}

  .fs-stage img{filter:var(--pg-filter,none)}

  @media (max-width:640px){
    .fs-chrome.top{flex-wrap:wrap}
    .fs-top-left{flex:1 1 100%}
    .fs-top-right{width:100%; justify-content:flex-end}
  }

  .fs-reader:not(.is-strip) .fs-stage{touch-action:none}
  /* paged spreads */
  .fs-spread{position:absolute; inset:0; display:flex; align-items:center;
             justify-content:center; z-index:1; pointer-events:none}
  .fs-spread.double{align-items:stretch}
  .fs-spread.double.rtl{flex-direction:row-reverse}
  .fs-spread.double img{flex:1 1 0; width:50%; min-width:0; height:100%;
                        max-width:50%; object-fit:contain}
  .fs-spread.double img:first-child{object-position:right center}
  .fs-spread.double img:last-child{object-position:left center}
  .fs-spread.double.rtl img:first-child{object-position:left center}
  .fs-spread.double.rtl img:last-child{object-position:right center}
  @keyframes rsInL{from{transform:translateX(-100%)}to{transform:none}}
  @keyframes rsInR{from{transform:translateX(100%)}to{transform:none}}
  @keyframes rsOutL{from{transform:none}to{transform:translateX(-100%)}}
  @keyframes rsOutR{from{transform:none}to{transform:translateX(100%)}}
  .fs-spread.enter-left{animation:rsInL .22s ease-out}
  .fs-spread.enter-right{animation:rsInR .22s ease-out}
  .fs-spread.exit-left{animation:rsOutL .22s ease-in forwards}
  .fs-spread.exit-right{animation:rsOutR .22s ease-in forwards}

  /* vertical strip */
  .fs-strip{position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
            overflow-anchor:none; z-index:2; -webkit-overflow-scrolling:touch;
            touch-action:pan-y pinch-zoom; overscroll-behavior:contain;
            scrollbar-width:thin; background:#000}
  .strip-page{position:relative; width:100%; max-width:960px; margin:0 auto;
              min-height:60vh; display:flex; align-items:center;
              justify-content:center; color:#666; font-size:12px}
  .strip-page.loaded{min-height:0; display:block}
  .strip-page.err{color:#c77}
  .fs-strip img{display:block; width:100%; height:auto; max-width:100%;
                max-height:none; object-fit:fill}
  .strip-edge{padding:80px 14px 22px; text-align:center}
  .strip-edge.bottom{padding:26px 14px 110px}
  .strip-nav{width:100%; max-width:520px; padding:14px 16px; border-radius:12px;
             border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.1);
             color:#fff; font:inherit; font-weight:700; cursor:pointer}
  .strip-nav small{display:block; font-weight:500; opacity:.75; margin-top:3px}
  .strip-end{color:#778; font-size:12px; padding:10px}

  /* edge progress bar */
  .fs-edge{position:absolute; z-index:25; background:rgba(255,255,255,.12);
           display:none; pointer-events:none}
  .fs-edge > div{background:var(--accent)}
  .fs-reader[data-progress="top"] .fs-edge{display:block; top:0; left:0; right:0; height:4px}
  .fs-reader[data-progress="left"] .fs-edge{display:block; top:0; bottom:0; left:0; width:4px}
  .fs-reader[data-progress="right"] .fs-edge{display:block; top:0; bottom:0; right:0; width:4px}
  .fs-reader[data-progress="top"] .fs-progress,
  .fs-reader[data-progress="left"] .fs-progress,
  .fs-reader[data-progress="right"] .fs-progress,
  .fs-reader[data-progress="off"] .fs-progress{visibility:hidden}
  .fs-reader.prog-rtl .fs-progress > div,
  .fs-reader.prog-rtl[data-progress="top"] .fs-edge > div{margin-left:auto}

  /* settings modal */
  .rs-modal{gap:16px}
  .rs-head{display:flex; align-items:center; justify-content:space-between}
  .rs-head h3{margin:0}
  .rs-sec{display:flex; flex-direction:column; gap:7px}
  .rs-sec.hidden{display:none}
  .rs-lbl{font:700 11px/1 ui-monospace,monospace; letter-spacing:1.6px;
          text-transform:uppercase; color:var(--dim)}
  .rs-row{display:flex; gap:8px; align-items:stretch}
  .rs-seg{display:flex; gap:6px; flex:1}
  .rs-opt{flex:1; min-height:42px; border-radius:10px; border:1px solid var(--line);
          background:var(--panel2); color:var(--txt); cursor:pointer; font:inherit;
          font-weight:700; font-size:13px; padding:6px 8px; display:flex;
          align-items:center; justify-content:center; gap:6px;
          -webkit-tap-highlight-color:transparent}
  .rs-opt:hover{border-color:var(--accent)}
  .rs-opt.on{background:color-mix(in srgb, var(--accent) 22%, var(--panel2));
             border-color:var(--accent); color:var(--accent)}
  .rs-step{display:flex; align-items:center; background:var(--panel2);
           border:1px solid var(--line); border-radius:10px; overflow:hidden; flex:1}
  .rs-step button{width:48px; height:42px; border:0; background:transparent;
                  color:var(--txt); font-size:20px; cursor:pointer}
  .rs-step button:hover{background:var(--card-hover)}
  .rs-step .val{flex:1; text-align:center; font-weight:700}
  .modal label.rs-check{display:flex; align-items:center; justify-content:center;
                        gap:10px; min-height:42px; border-radius:10px; margin:0;
                        border:1px solid var(--line); background:var(--panel2);
                        color:var(--txt); font-size:14px; font-weight:700; cursor:pointer}
  .modal label.rs-check:has(input:checked){border-color:var(--accent); color:var(--accent);
        background:color-mix(in srgb, var(--accent) 18%, var(--panel2))}
  .rs-check input{width:18px; height:18px; accent-color:var(--accent)}
  .rs-range{width:100%; accent-color:var(--accent)}
  .rs-out{min-width:64px; text-align:right; font:700 13px ui-monospace,monospace; color:var(--dim)}
  .rs-note{font-size:12px; color:var(--dim); line-height:1.5}

  /* jump menu */
  .mangadex-helper{display:inline-block; margin-top:3px; color:var(--dim); opacity:.78;
    font-size:11px; line-height:1.3; text-decoration:none; white-space:normal}
  .mangadex-helper:hover{opacity:1; color:var(--txt); text-decoration:underline}
  .lib-title-wrap{display:flex; flex-direction:column; align-items:flex-start; min-width:0}
  /* Keep the five manga actions readable on narrow library cards. */
  .manga-actions{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px; padding:0 11px 11px}
  .manga-actions button{min-width:0; width:100%; min-height:29px; padding:5px 3px; font-size:10px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:none}
  .manga-actions button:first-child{grid-column:1 / -1}
  @media(max-width:600px){.manga-actions{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); flex-wrap:initial}}
  .jm-now{font-size:12px; color:var(--dim)}
  .jm-now b{color:var(--txt)}
  .jm-chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px}
  .jm-chip{flex:0 0 auto; border-radius:10px; border:1px solid var(--line);
           background:var(--panel2); color:var(--txt); cursor:pointer; font:inherit;
           font-weight:700; font-size:13px; padding:7px 12px; text-align:center}
  .jm-chip small{display:block; font-weight:500; color:var(--dim); font-size:10px}
  .jm-chip.cur::before{content:"● "; color:var(--accent)}
  .jm-chip.on{border-color:var(--accent);
              background:color-mix(in srgb, var(--accent) 18%, var(--panel2))}
</style>
</head>
<body>

<header class="topnav" id="topnav">
  <div class="brand">📖 Erlan<span>Yomi</span><span id="saveDot" class="save-dot" title="Saved locally"></span></div>
  <div class="viewtabs" id="viewTabs">
    <button class="viewtab" data-view="library">📚 Library</button>
    <button class="viewtab" data-view="counter">🔢 Counter</button>
    <button class="viewtab" data-view="stats">📊 Stats</button>
  </div>
  <div class="topright">
    <div class="theme-picker" id="themePicker"></div>
    <button class="btn" id="undoBtn" title="Undo last count">↶ Undo</button>
  </div>
</header>

<div class="subbar hidden" id="subbar">
  <button class="btn" id="backToLib">← Library</button>
  <span class="title" id="readerTitle">—</span>
  <div class="posgroup">
    <div class="pos">
      <span class="lbl">Vol</span>
      <button data-nav="vol-">−</button>
      <input id="volInput" type="number" min="1" value="1">
      <button data-nav="vol+">+</button>
    </div>
    <div class="pos">
      <span class="lbl">Ch</span>
      <button data-nav="ch-">−</button>
      <input id="chInput" type="number" min="0" step="0.1" value="1">
      <button data-nav="ch+">+</button>
    </div>
    <div class="pos">
      <span class="lbl">Page</span>
      <button data-nav="page-">−</button>
      <input id="pageInput" type="number" min="1" value="1">
      <button data-nav="page+">+</button>
    </div>
  </div>
  <div style="flex:1"></div>
  <button class="btn" id="exportManga" title="Export counters">💾 Save</button>
</div>

<main id="main"></main>
<div id="toast"></div>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3>Add manga</h3>
    <div class="choice">
      <label id="folderChoiceLabel">
        <input type="radio" name="addmode" value="folder" checked>
        <div>
          <div class="title">🔗 Link a folder</div>
          <div class="sub">Images stay on disk — no copy. Chrome / Edge on desktop only.</div>
        </div>
      </label>
      <label>
        <input type="radio" name="addmode" value="cbz">
        <div>
          <div class="title">📦 Upload CBZ files</div>
          <div class="sub">Copies into the browser. Uses storage. Works on mobile.</div>
        </div>
      </label>
      <label>
        <input type="radio" name="addmode" value="images">
        <div>
          <div class="title">🖼 Upload image files</div>
          <div class="sub">Copies into the browser. Works on mobile.</div>
        </div>
      </label>
    </div>
    <div class="actions">
      <button class="btn" id="addCancel">Cancel</button>
      <button class="btn primary" id="addContinue">Continue</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="reorgModal">
  <div class="modal" style="width:min(600px,96vw)">
    <h3>Confirm upload</h3>
    <div id="reorgInfo" class="info"></div>
    <label>Manga title</label>
    <input type="text" id="reorgTitleInput" placeholder="e.g. Kimi ga Shinu made Koi o Shitai">
    <div id="reorgWarn" class="warn" style="display:none"></div>
    <label>Detected structure — edit Vol / Ch numbers / names</label>
    <div class="tree" id="reorgTree"></div>
    <div class="actions">
      <button class="btn" id="reorgCancel">Cancel</button>
      <button class="btn primary" id="reorgSave">Save manga</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="noteModal">
  <div class="modal" style="width:min(400px,96vw)">
    <h3 id="noteTitle">Count</h3>
    <div>
      <label>Note (optional)</label>
      <input type="text" id="noteInput" placeholder="e.g. Sheena is blushing">
    </div>
    <div class="actions">
      <button class="btn" id="noteSkip">Skip</button>
      <button class="btn primary" id="noteSave">Count it</button>
    </div>
  </div>
</div>

<script>
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
const HAS_FS_API = !!window.showDirectoryPicker;
const LS_KEY = 'mangaCounter.v4';
const LS_KEY_MIGRATE = ['mangaCounter.v3','mangaCounter.v2', 'mangaCounter.v1'];
const THEME_KEY = 'mangaCounter.theme';
const DB_NAME = 'mangaCounterImages';
const DB_STORE = 'files';
const DEFAULT_STORAGE_CAP = 300 * 1024 * 1024;

const THEMES = [
  { id:'dark',    label:'Dark',        swatch:'linear-gradient(135deg,#0e1015 50%,#7c9cff 50%)' },
  { id:'pink',    label:'Pink Cutesy', swatch:'linear-gradient(135deg,#fff0f6 50%,#ff5fa2 50%)' },
  { id:'matcha',  label:'Matcha',      swatch:'linear-gradient(135deg,#f2f7ed 50%,#5a9e3a 50%)' },
  { id:'sky',     label:'Sky',         swatch:'linear-gradient(135deg,#eef6ff 50%,#2f7fd4 50%)' },
  { id:'vintage', label:'Vintage',     swatch:'linear-gradient(135deg,#f5efe3 50%,#a0682c 50%)' },
];
const KEY_POOL = 'qwertyuiopasdfghjklzxcvbnm';

/* ===== Reader settings (persisted) ===== */
const RS_KEY = 'mangaCounter.readerSettings.v1';
const RS_DEFAULTS = {
  strip:false, stripMargin:0,
  layout:'single', offset:false, slide:false,
  scrollMode:'continuous', scrollSpeed:80, advanceSecs:8,
  progressPos:'bottom', preload:'some', hideTap:'single',
  grey:false, dim:0
};
const RS_LIMITS = { stripMargin:[0,400], scrollSpeed:[10,600], advanceSecs:[1,120], dim:[0,80] };
function sanitizeRS(s){
  const o = { ...RS_DEFAULTS, ...(s || {}) };
  for(const k in RS_LIMITS){
    const n = Number(o[k]);
    o[k] = isFinite(n) ? Math.min(RS_LIMITS[k][1], Math.max(RS_LIMITS[k][0], n)) : RS_DEFAULTS[k];
  }
  if(!['single','double'].includes(o.layout)) o.layout = 'single';
  if(!['continuous','step'].includes(o.scrollMode)) o.scrollMode = 'continuous';

/* IndexedDB */
let dbPromise = null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
  return dbPromise;
}
async function idbPut(key, val){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(key){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(key);
    req.onsuccess = () => res(req.result || null);
    req.onerror = () => rej(req.error);
  });
}
async function idbDelete(key){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function idbAllKeys(prefix){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).getAllKeys();
    req.onsuccess = () => {
      const keys = req.result || [];
      res(prefix ? keys.filter(k => k.startsWith(prefix)) : keys);
    };
    req.onerror = () => rej(req.error);
  });
}
async function storageEstimate(){
  try{
    if(navigator.storage && navigator.storage.estimate){
      const e = await navigator.storage.estimate();
      return { used: e.usage || 0, quota: e.quota || 0 };
    }
  }catch(e){}
  return { used: 0, quota: 0 };
}
function fmtDur(ms){
  ms = Math.max(0, ms || 0); if(!ms) return '0m';
  const mins = Math.round(ms/60000);
  if(mins < 1) return '<1m';
  if(mins < 60) return mins + 'm';
  const h = Math.floor(mins/60), r = mins % 60;
  return r ? `${h}h ${r}m` : `${h}h`;
}
function ensureReadTime(m){
  if(!m.readTime || typeof m.readTime !== 'object') m.readTime = {};
  if(!m.readTimeBackfilled){
    m.readTimeBackfilled = true;
    for(const sess of (m.readingSessions || [])) for(const x of (sess.chapterBreakdown || [])){
      if(x && x.timeMs > 0){ const k = `${x.v}:${x.ch}`; m.readTime[k] = (m.readTime[k] || 0) + x.timeMs; }
    }
  }
  return m.readTime;
}
function addReadTime(m, key, ms){ if(!m || !key || !(ms > 0)) return; const t = ensureReadTime(m); t[key] = (t[key] || 0) + ms; }
function mangaReadMs(m){ return Object.values(ensureReadTime(m)).reduce((a, b) => a + (b || 0), 0); }
function volReadMs(m, v){ const t = ensureReadTime(m); let n = 0; for(const k in t) if(k.startsWith(`${v}:`)) n += t[k] || 0; return n; }
function chReadMs(m, v, c){ return ensureReadTime(m)[`${v}:${c}`] || 0; }
function readTimeHTML(m){
  const total = mangaReadMs(m);
  if(!total) return '<p class="hint">No reading time recorded yet. It adds up while you read in the reader.</p>';
  const rows = (m.volumes || []).map(v => {
    const vt = volReadMs(m, v.num);
    const chs = v.chapters.map(c => ({n:c.num, t:chReadMs(m, v.num, c.num)})).filter(x => x.t > 0)
      .map(x => `Ch ${x.n}: ${fmtDur(x.t)}`).join(' · ');
    return `<tr><td>Volume ${v.num}</td><td class="num">${fmtDur(vt)}</td><td class="dim">${chs}</td></tr>`;
  }).join('');
  return `<div class="wrap"><table class="tbl"><thead><tr><th></th><th>Time</th><th>Chapters</th></tr></thead><tbody>${rows}
    <tr class="totalrow"><td>ALL</td><td class="num">${fmtDur(total)}</td><td></td></tr></tbody></table></div>`;
}
function fmtBytes(b){
  if(!b) return '0 B';
  if(b < 1024) return b + ' B';
  if(b < 1048576) return (b/1024).toFixed(1) + ' KB';
  if(b < 1073741824) return (b/1048576).toFixed(1) + ' MB';
  return (b/1073741824).toFixed(2) + ' GB';
}

/* Parsing */
function parseVolNum(name){
  if(!name) return null;
  const s = String(name);
  let m = s.match(/\b(?:vol(?:ume)?|v)\s*[.\-_]?\s*0*(\d+)/i);
  if(m) return parseInt(m[1], 10);
  m = s.match(/^\s*0*(\d+)\s*$/);
  if(m) return parseInt(m[1], 10);
  return null;
}
function parseChNum(name){
  if(!name) return null;
  const s = String(name);
  let m = s.match(/\bch(?:apter)?\s*[.\-_]?\s*0*(\d+(?:\.\d+)?)/i);
  if(m) return parseFloat(m[1]);
  m = s.match(/^\s*0*(\d+(?:\.\d+)?)\s*$/);
  if(m) return parseFloat(m[1]);
  return null;
}
function parsePageNum(filename){
  const s = String(filename);
  let m = s.match(/\bpage\s*[.\-_]?\s*0*(\d+)/i);
  if(m) return parseInt(m[1], 10);
  const nums = [...s.matchAll(/(\d+)/g)];
  if(nums.length) return parseInt(nums[nums.length - 1][1], 10);
  return 0;
}
function stripFileExt(s){
  return String(s).replace(/\.(cbz|zip|cbr|rar|7z|pdf|jpe?g|png|webp|gif|bmp|avif)$/i, '');
}
function cleanChapterName(s){
  s = String(s || '');
  /* drop release tags like [Group], (Digital), (xyz Scans) */
  s = s.replace(/\s*[\[\(]\s*(?:digital|web|official|raw|[^\]\)]*(?:scans?|scanlations?|group|team|fansub|translations?)[^\]\)]*)\s*[\]\)]\s*/gi, ' ');
  s = s.replace(/\s+/g, ' ').trim();
  s = s.replace(/^[\s\-–—_:.,]+/, '').replace(/[\s\-–—_:,]+$/, '').trim();
  if(s && !/\s/.test(s) && s.includes('_')) s = s.replace(/_+/g, ' ').trim();
  return s;
}
/* Handles names such as:
   "Title - ch 1-16, 17.1-20, 21.1-42.5 vol 001  ch 002 Kiss"  -> vol 1, ch 2, "Kiss"
   "Vol 001 Ch 003 I am Myself.cbz"                            -> vol 1, ch 3, "I am Myself" */
function parseChapterFolder(name){
  const s = stripFileExt(String(name || '')).trim();
  const volMatches = [...s.matchAll(/\bvol(?:ume)?\.?\s*[-_]?\s*0*(\d+)/gi)];
  const volM = volMatches.length ? volMatches[volMatches.length - 1] : null;
  const vol = volM ? parseInt(volM[1], 10) : null;
  const volEnd = volM ? volM.index + volM[0].length : 0;
  const chMatches = [...s.matchAll(/\bch(?:apter)?\.?\s*[-_]?\s*0*(\d+(?:\.\d+)?)/gi)];
  let pick = null;
  if(chMatches.length){
    /* when a volume is present, the chapter belonging to it is the first "ch" AFTER it
       (earlier "ch 1-16, 17.1-20" is just the range of the whole bundle) */
    const after = chMatches.filter(x => x.index >= volEnd);
    pick = (volM && after.length) ? after[0] : chMatches[chMatches.length - 1];
  }
  let ch = null, chName = '';
  if(pick){
    ch = parseFloat(pick[1]);
    chName = cleanChapterName(s.slice(pick.index + pick[0].length));
  }
  return { vol, ch, name: chName };
}

async function resolveFolderPath(rootHandle, path){

  for(let i = 0; i < parts.length - 1; i++){
    curPath += '/' + parts[i];
    let next = dirHandleCache.get(curPath);
    if(!next){
      next = await dir.getDirectoryHandle(parts[i]);
      dirHandleCache.set(curPath, next);
    }
    dir = next;
  }
  const fh = await dir.getFileHandle(parts[parts.length - 1]);
  return await fh.getFile();
}
async function fileFromHandle(handle, path){
  try{ return await resolveFolderPath(handle, path); }
  catch(e){ return null; }
}
function progressPct(m){
  if(!m.volumes.length) return 0;
  const totalPages = m.volumes.reduce((s, v) =>
    s + v.chapters.reduce((cs, c) => cs + (c.pageCount || 0), 0), 0);
  if(!totalPages) return 0;
  let read = 0, found = false;
  for(const v of m.volumes){
    for(const ch of v.chapters){
      if(found) break;
      if(v.num === m.volume && ch.num === m.chapter){
        read += Math.min(m.page, ch.pageCount || 0); found = true;
      } else if(v.num < m.volume || (v.num === m.volume && ch.num < m.chapter)){
        read += ch.pageCount || 0;
      }
    }
  }
  return Math.min(100, Math.round((read / totalPages) * 100));
}

/* Stats */
function volSummaryHTML(m, v){
  const evs = m.events.filter(e => e.v === v);
  if(!evs.length) return `<div class="vol-summary"><h4>Volume ${v}${volReadMs(m,v)>0?` <small class="dim">· ⏱ ${fmtDur(volReadMs(m,v))}</small>`:''}</h4>
      <div class="dim" style="font-size:12px">No counts recorded.</div></div>`;
  const counts = {};
  for(const e of evs){
    if(!counts[e.cid]) counts[e.cid] = { story:0, cover:0, total:0 };
    if(e.c) counts[e.cid].cover++; else counts[e.cid].story++;
    counts[e.cid].total++;
  }
  const ranked = Object.entries(counts).map(([cid, c]) => {
    const counter = m.counters.find(x => x.id === cid);
    return { name: counter ? counter.name : '?', ...c };
  }).sort((a, b) => b.total - a.total);
  const firstSeen = {};
  for(const e of evs){ if(!firstSeen[e.cid] || e.t < firstSeen[e.cid].t) firstSeen[e.cid] = e; }
  const firsts = Object.entries(firstSeen).map(([cid, e]) => {
    const counter = m.counters.find(x => x.id === cid);
    return { name: counter ? counter.name : '?', p: e.p, ch: e.ch || 1, cover: !!e.c };
  }).sort((a, b) => a.p - b.p);
  const lastSeen = {};
  for(const e of evs){ if(!lastSeen[e.cid] || e.t > lastSeen[e.cid].t) lastSeen[e.cid] = e; }
  const lasts = Object.entries(lastSeen).map(([cid, e]) => {
    const counter = m.counters.find(x => x.id === cid);
    return { name: counter ? counter.name : '?', p: e.p, ch: e.ch || 1 };
  }).sort((a, b) => a.p - b.p);
  const notes = evs.filter(e => e.n).map(e => {
    const counter = m.counters.find(x => x.id === e.cid);
    return { name: counter ? counter.name : '?', p: e.p, ch: e.ch || 1, n: e.n };
  }).sort((a, b) => a.p - b.p);
  const pages = evs.map(e => e.p);
  const pageRange = pages.length ? `${Math.min(...pages)}–${Math.max(...pages)}` : '–';
  const chapters = new Set(evs.map(e => e.ch || 1));
  return `<div class="vol-summary">
    <h4>Volume ${v} — summary</h4>
    <div class="vs-grid">
      <div class="vs-block"><div class="vs-title">Overview</div>
        <div><b>${evs.length}</b> counts · <b>${new Set(pages).size}</b> pages</div>
        <div>Pages: <b>${pageRange}</b></div>
        <div>Chapters: <b>${[...chapters].join(', ')}</b></div></div>
      <div class="vs-block"><div class="vs-title">Most counted</div>
        <ul>${ranked.map(r =>
          `<li><b>${esc(r.name)}</b> — ${r.total} <span class="dim">(${r.story}s${r.cover?`, ${r.cover}c`:''})</span></li>`
        ).join('')}</ul></div>
      <div class="vs-block"><div class="vs-title">First appearances</div>
        <ul>${firsts.map(f =>
          `<li><b>${esc(f.name)}</b> — Ch ${f.ch} · p. ${f.p}${f.cover?' <span class="chip cover">cover</span>':''}</li>`
        ).join('')}</ul></div>
      <div class="vs-block"><div class="vs-title">Last seen</div>
        <ul>${lasts.map(l => `<li><b>${esc(l.name)}</b> — Ch ${l.ch} · p. ${l.p}</li>`).join('')}</ul></div>
      <div class="vs-block" style="grid-column:1 / -1"><div class="vs-title">Notes</div>
        <ul>${notes.length ? notes.map(n =>
          `<li><b>${esc(n.name)}</b> · Ch ${n.ch} p. ${n.p} — ${esc(n.n)}</li>`
        ).join('') : '<li class="dim">None</li>'}</ul></div>
    </div></div>`;
}

function ensureSession(m){

  }

function recordReadingPage(v, ch, p){
  const m=currentManga(); if(!m || state.view!=='reader') return;
  const s=ensureSession(m); if(!s) return;
  const vv=v ?? m.volume, cc=ch ?? m.chapter, pp=p ?? m.page;
  const now=Date.now();
  if(s.lastTickAt && s.lastChapterKey && s.chapterStats?.[s.lastChapterKey]){ const dt=Math.min(60000,Math.max(0,now-s.lastTickAt)); s.chapterStats[s.lastChapterKey].timeMs=(s.chapterStats[s.lastChapterKey].timeMs||0)+dt; addReadTime(m,s.lastChapterKey,dt); }
  s.lastTickAt=now; s.lastChapterKey=`${vv}:${cc}`;
  s.to={v:vv,ch:cc,p:pp}; m.lastReadAt=now;
  const id=`${vv}:${cc}:${pp}`; if(!s.pages.includes(id)) s.pages.push(id);
  const ck=`${vv}:${cc}`; if(!s.chapters.includes(ck)) s.chapters.push(ck);
  if(!s.chapterStats) s.chapterStats={}; if(!s.chapterStats[ck]) s.chapterStats[ck]={v:vv,ch:cc,pages:[],timeMs:0};
  if(!s.chapterStats[ck].pages.includes(pp)) s.chapterStats[ck].pages.push(pp);
  if(!m.readChapters) m.readChapters={};
  const current=m.volumes.find(x=>x.num===vv)?.chapters.find(x=>x.num===cc);
  if(current && current.pageCount && pp>=current.pageCount) m.readChapters[ck]=true;
  if(m) m.activeReadingSession=s;
  saveSoon();
}

/* ===== Reader helpers ===== */
const isStrip = () => !!rs.strip;
const isDouble = () => !rs.strip && rs.layout === 'double';
let curSpreadLen = 1;
let lastNavDelta = 0;
let lastMidTap = 0;
let lastProgress = 0;
let saveTimer = null;
const pageDims = new Map();       /* cache key -> is landscape */
const preloadDone = new Set();
let preloadToken = 0;
let stripState = null;
let activeReadSession = null;
let zoomState = {scale:1,x:0,y:0,pointers:new Map(),startDist:0,startScale:1,lastTap:0};
let libraryHideRead = false;
let libraryShowCovers = false;
let jumpHideRead = false;
let resumePromptShownIds = new Set();

function curChapter(m){
  const vol = m.volumes.find(v => v.num === m.volume);
  return vol ? (vol.chapters.find(c => c.num === m.chapter) || null) : null;
}
function saveSoon(){
  setSaveIndicator(true);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveTimer = null; save(); }, 500);
}
function flushSave(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  save();
}
/* chapter name: stored name, else detected from the linked folder path */
function getChapterName(m, ch){
  if(!ch) return '';
  if(ch.name) return ch.name;
  if(m.sourceType === 'folder' && ch.keys && ch.keys[0]){
    const parts = String(ch.keys[0]).split('/');
    parts.pop();
    const meta = parseChapterFolder(parts[parts.length - 1] || '');
    if(meta.name){ ch.name = meta.name; saveSoon(); return ch.name; }
  }
  return '';
}
function chapterFlat(m){
  const out = [];
  for(const v of m.volumes) for(const c of v.chapters) out.push({ vol: v, ch: c });
  return out;
}
function chapterNeighbor(m, d){
  const flat = chapterFlat(m);
  const i = flat.findIndex(x => x.vol.num === m.volume && x.ch.num === m.chapter);
  if(i < 0) return null;
  return flat[i + d] || null;
}
function chapterTitle(m, n){
  const nm = getChapterName(m, n.ch);
  return `Vol ${n.vol.num} · Ch ${n.ch.num}${nm ? ' — ' + esc(nm) : ''}`;
}
function isAtMangaEnd(m){
  const vi = m.volumes.findIndex(v => v.num === m.volume);
  if(vi < 0) return true;
  const v = m.volumes[vi];
  const ci = v.chapters.findIndex(c => c.num === m.chapter);
  if(ci < 0) return true;
  const lastCh = ci === v.chapters.length - 1 && vi === m.volumes.length - 1;
  return lastCh && (m.page + Math.max(1, curSpreadLen) > (v.chapters[ci].pageCount || 0));
}

function updateReaderMeta(){
  const m = currentManga();
  if(!m) return;
  const ch = curChapter(m);
  const total = ch ? ch.pageCount || 0 : 0;
  const name = ch ? getChapterName(m, ch) : '';
  const meta = document.getElementById('fsMeta');
  if(meta){
    let pageTxt = '';
    if(total){
      pageTxt = `p. ${m.page} / ${total}`;
      if(isDouble() && curSpreadLen > 1) pageTxt = `p. ${m.page}–${m.page + curSpreadLen - 1} / ${total}`;
    }
    meta.title = 'Long-press to jump to a page';
    meta.innerHTML = `<span class="fs-vc">Vol ${m.volume} · Ch ${m.chapter}</span>` +
      (pageTxt ? ` <span class="fs-pg">${pageTxt}</span>` : '');
  }
  const nameEl = document.getElementById('fsChName');
  if(nameEl){
    nameEl.textContent = name;
    nameEl.style.display = name ? '' : 'none';
  }
  const jb = document.getElementById('fsJump');
  if(jb) jb.textContent = `📑 Vol ${m.volume} · Ch ${m.chapter}`;
}
function setProgress(f){
  lastProgress = Math.max(0, Math.min(1, f || 0));
  const pct = (lastProgress * 100) + '%';
  const a = document.getElementById('fsProgressFill');
  if(a) a.style.width = pct;

  if(e){
    if(rs.progressPos === 'left' || rs.progressPos === 'right'){ e.style.width = '100%'; e.style.height = pct; }
    else { e.style.height = '100%'; e.style.width = pct; }
  }
}
function applyReaderSettings(){
  const fs = document.getElementById('fsReader');
  if(!fs) return;
  const m = currentManga();
  const f = [];
  if(rs.grey) f.push('grayscale(1)');
  if(rs.dim > 0) f.push(`brightness(${(1 - rs.dim / 100).toFixed(2)})`);

  const fitBtn = document.getElementById('fsFit'); if(fitBtn) fitBtn.textContent = (fs.dataset.fit || 'page').toUpperCase();
  fs.classList.toggle('is-strip', rs.strip);

  updatePlayBtn();
}

/* ===== Page files / cache ===== */
function pageCacheKey(m, ch, p){
  const k = ch.keys ? ch.keys[p - 1] : null;
  return k ? m.id + '|' + k : null;
}
function maxCacheSize(){
  if(rs.preload === 'all') return 800;
  return rs.strip ? MAX_PAGE_CACHE * 4 : MAX_PAGE_CACHE + 4;
}
async function getPageFile(m, ch, page){
  const pathKey = ch.keys ? ch.keys[page - 1] : null;
  if(!pathKey) throw new Error('no-key');
  const key = m.id + '|' + pathKey;
  if(pageCache.has(key)) return pageCache.get(key);
  let file = null;
  if(m.sourceType === 'folder'){
    const handle = folderHandleCache[m.id] || await idbGet('handle:' + m.id);
    if(!handle) throw new Error('no-handle');
    let perm = 'granted';
    try{ perm = await handle.queryPermission({ mode: 'read' }); }catch(e){}
    if(perm !== 'granted'){
      try{
        const req = await handle.requestPermission({ mode: 'read' });
        if(req !== 'granted') throw new Error('no-perm');
      }catch(e){ throw new Error('no-perm'); }
    }
    folderHandleCache[m.id] = handle;
    file = await resolveFolderPath(handle, pathKey);
    if(!file) throw new Error('no-file');
  } else if(m.sourceType === 'uploaded'){
    file = await idbGet(pathKey);
    if(!file) throw new Error('no-blob');
  } else throw new Error('no-source');
  while(pageCache.size >= maxCacheSize()){
    const firstKey = pageCache.keys().next().value;
    pageCache.delete(firstKey);
  }
  pageCache.set(key, file);
  return file;
}
function errMsg(err){
  const c = err && err.message;
  if(c === 'no-perm')   return 'Permission to read the folder was denied.';
  if(c === 'no-handle') return 'Folder not connected this session.';
  if(c === 'no-file')   return 'Page file missing — folder may have changed.';
  if(c === 'no-blob')   return 'Page image missing from storage.';
  if(c === 'no-source') return 'No images linked for this manga.';
  return 'Could not load page.';
}
function prefetchAround(m, ch, page){
  if(!ch) return;
  const n = ch.pageCount || 0;
  if(rs.preload === 'all'){ preloadChapter(m, ch, page); return; }
  const around = isDouble() ? [page + 2, page + 3, page + 4, page - 1, page - 2]
                            : [page + 1, page - 1, page + 2];
  for(const p of around){
    if(p < 1 || p > n) continue;
    const key = pageCacheKey(m, ch, p);
    if(!key || pageCache.has(key)) continue;
    getPageFile(m, ch, p).catch(() => {});
  }
}
async function preloadChapter(m, ch, fromPage){
  const n = ch.pageCount || 0;
  const doneKey = m.id + '|' + (ch.keys && ch.keys[0]);
  if(preloadDone.has(doneKey)) return;
  const tok = ++preloadToken;
  const order = [];
  for(let p = fromPage; p <= n; p++) order.push([ch, p]);
  for(let p = fromPage - 1; p >= 1; p--) order.push([ch, p]);
  const nx = chapterNeighbor(m, 1);
  if(nx) for(let p = 1; p <= Math.min(3, nx.ch.pageCount || 0); p++) order.push([nx.ch, p]);
  for(const [c, p] of order){
    if(tok !== preloadToken) return;
    const key = pageCacheKey(m, c, p);
    if(key && !pageCache.has(key)){
      try{ await getPageFile(m, c, p); }catch(e){}
      await new Promise(r => setTimeout(r, 0));
    }
  }
  if(tok === preloadToken) preloadDone.add(doneKey);
}

/* ===== Paged rendering ===== */
function spreadStart(page){
  if(rs.offset) return page <= 1 ? 1 : (page % 2 === 0 ? page : page - 1);
  return page % 2 === 1 ? page : page - 1;
}
function isLandscapePage(m, ch, p){
  const k = pageCacheKey(m, ch, p);
  return !!(k && pageDims.get(k));
}
function spreadPagesFor(m, ch, start, total){
  if(!isDouble()) return [start];
  if(rs.offset && start === 1) return [1];
  if(isLandscapePage(m, ch, start)) return [start];
  const pages = [start];
  if(start + 1 <= total && !isLandscapePage(m, ch, start + 1)) pages.push(start + 1);
  return pages;
}
function backStep(m, ch){
  if(!isDouble() || !ch) return 1;
  const p = m.page;
  if(p - 2 < 1) return 1;
  if(isLandscapePage(m, ch, p - 1) || isLandscapePage(m, ch, p - 2)) return 1;
  return 2;
}
function disposeSpread(w){
  if(!w) return;
  if(w._urls) w._urls.forEach(u => URL.revokeObjectURL(u));
  w.remove();
}
function clearPaged(){
  document.querySelectorAll('#fsStage .fs-spread').forEach(disposeSpread);
  currentDisplayImg = null;
}
function emptyStateHTML(m, msg){
  return `
    <div>${msg}</div>
    <div style="margin-top:8px">Counters are safe — <b>${m.events.length}</b> counts preserved.</div>
    <div style="margin-top:16px">
      <button class="btn primary" data-act="openFolder" data-id="${m.id}">🔗 Link folder</button>
    </div>`;
}
async function loadCurrentPage(){
  resetZoom();
  const m = currentManga();
  if(!m) return;
  const stage = document.getElementById('fsStage');
  if(!stage) return;
  const ch = curChapter(m);
  const empty = document.getElementById('fsEmpty');
  const token = ++currentPageLoadToken;
  if(!ch){
    teardownStrip(); clearPaged(); setProgress(0); updateReaderMeta();
    if(empty){
      empty.style.display = '';
      empty.innerHTML = emptyStateHTML(m, `⚠ No pages linked for Vol ${m.volume} · Ch ${m.chapter}.`);
    }
    return;
  }
  const total = ch.pageCount || 0;
  if(total && m.page > total){ m.page = total; saveSoon(); }
  if(m.page < 1) m.page = 1;
  recordReadingPage();
  updateReaderMeta();
  if(isStrip()){
    clearPaged();
    if(empty) empty.style.display = 'none';
    renderStrip(m, ch);
    return;
  }
  teardownStrip();
  setProgress(total ? m.page / total : 0);
  const rtl = m.readingDirection !== 'ltr';
  let pages = spreadPagesFor(m, ch, m.page, total);
  try{
    const files = await Promise.all(pages.map(p => getPageFile(m, ch, p)));
    if(token !== currentPageLoadToken) return;
    let urls = files.map(f => URL.createObjectURL(f));
    let imgs = urls.map(u => { const i = new Image(); i.src = u; i.alt = ''; i.draggable = false; return i; });
    await Promise.all(imgs.map(i => i.decode().catch(() => {})));
    if(token !== currentPageLoadToken){ urls.forEach(u => URL.revokeObjectURL(u)); return; }
    imgs.forEach((i, idx) => {
      const k = pageCacheKey(m, ch, pages[idx]);
      if(k && i.naturalWidth) pageDims.set(k, i.naturalWidth > i.naturalHeight);
    });
    if(pages.length > 1 && imgs.some(i => i.naturalWidth > i.naturalHeight)){
      URL.revokeObjectURL(urls[1]);
      pages = [pages[0]]; urls = [urls[0]]; imgs = [imgs[0]];
    }
    const w = document.createElement('div');
    w.className = 'fs-spread' + (imgs.length > 1 ? ' double' : '') + (imgs.length > 1 && rtl ? ' rtl' : '');
    imgs.forEach(i => w.appendChild(i));
    w._urls = urls;
    if(empty) empty.style.display = 'none';
    const old = currentDisplayImg;
    stage.querySelectorAll('.fs-spread').forEach(x => { if(x !== old) disposeSpread(x); });
    const animate = rs.slide && lastNavDelta && old;
    if(animate){
      const fromLeft = (lastNavDelta > 0) === rtl;
      w.classList.add(fromLeft ? 'enter-left' : 'enter-right');
      old.classList.add(fromLeft ? 'exit-right' : 'exit-left');
      setTimeout(() => { if(old !== currentDisplayImg) disposeSpread(old); }, 260);
    } else if(old){
      disposeSpread(old);
    }
    lastNavDelta = 0;
    stage.appendChild(w);
    currentDisplayImg = w;
    curSpreadLen = pages.length;
    if(pages.length>1) recordReadingPage(m.volume,m.chapter,pages[1]);
    updateReaderMeta();
    setProgress(total ? (m.page + pages.length - 1) / total : 0);
    if('requestIdleCallback' in window){
      requestIdleCallback(() => prefetchAround(m, ch, m.page), { timeout: 500 });
    } else setTimeout(() => prefetchAround(m, ch, m.page), 30);
    scheduleAdvance();
  }catch(err){
    if(token !== currentPageLoadToken) return;
    clearPaged();
    if(empty){
      empty.style.display = '';
      empty.innerHTML = emptyStateHTML(m, errMsg(err));
    }
    scheduleAdvance();
  }
}
function goPage(delta){
  const m = currentManga();
  if(!m) return;
  if(isStrip()){ stripScrollPage(delta); return; }
  const vol = m.volumes.find(v => v.num === m.volume);
  const ch = vol ? vol.chapters.find(c => c.num === m.chapter) : null;
  const totalPages = ch ? (ch.pageCount || 0) : 0;
  lastNavDelta = delta;
  let p;
  if(isDouble()) p = delta > 0 ? m.page + Math.max(1, curSpreadLen) : m.page - backStep(m, ch);
  else p = m.page + delta;
  const normLast = pg => isDouble() ? Math.max(1, spreadStart(pg)) : pg;
  if(p < 1){
    const chapters = vol ? vol.chapters : [];
    const idx = chapters.findIndex(c => c.num === m.chapter);
    if(idx > 0){
      m.chapter = chapters[idx - 1].num;
      m.page = normLast(chapters[idx - 1].pageCount || 1);
    } else {
      const vi = m.volumes.findIndex(v => v.num === m.volume);
      if(vi > 0 && m.volumes[vi - 1].chapters.length){
        m.volume = m.volumes[vi - 1].num;
        const pv = m.volumes[vi - 1];
        const lc = pv.chapters[pv.chapters.length - 1];
        m.chapter = lc.num;
        m.page = normLast(lc.pageCount || 1);
      } else m.page = 1;
    }
  } else if(p > totalPages){
    const chapters = vol ? vol.chapters : [];
    const idx = chapters.findIndex(c => c.num === m.chapter);
    if(idx >= 0 && idx < chapters.length - 1){
      m.chapter = chapters[idx + 1].num; m.page = 1;
    } else {
      const vi = m.volumes.findIndex(v => v.num === m.volume);
      if(vi >= 0 && vi < m.volumes.length - 1 && m.volumes[vi + 1].chapters.length){
        m.volume = m.volumes[vi + 1].num;
        m.chapter = m.volumes[vi + 1].chapters[0].num;
        m.page = 1;
      } else m.page = normLast(totalPages || 1);
    }
  } else m.page = p;
  save();
  recordReadingPage();
  if(p<1 || p>totalPages) showChapterTransition();
  loadCurrentPage();
}
function jumpTo(v, c){
  const m = currentManga();
  if(!m) return;
  m.volume = v; m.chapter = c; m.page = 1;
  lastNavDelta = 0;
  recordReadingPage();
  save();
  loadCurrentPage();
}
function goChapterRel(d){
  const m = currentManga();
  if(!m) return false;
  const n = chapterNeighbor(m, d);
  if(!n) return false;
  m.volume = n.vol.num; m.chapter = n.ch.num;
  m.page = d < 0 ? (n.ch.pageCount || 1) : 1;
  lastNavDelta = 0;
  showChapterTransition(); recordReadingPage();
  save();
  loadCurrentPage();
  return true;
}

/* ===== Vertical strip ===== */
function teardownStrip(){
  const st = stripState;
  stripState = null;
  if(st){
    if(st.io) st.io.disconnect();
    st.urls.forEach(u => URL.revokeObjectURL(u));
  }
  document.getElementById('fsStrip')?.remove();
}
function stripScrollPage(dir){
  const s = document.getElementById('fsStrip');
  if(!s) return;
  s.scrollBy({ top: dir * s.clientHeight * 0.85, behavior: 'smooth' });
}
function placeStripImage(st, i, img){
  const w = st.wraps[i - 1];
  const strip = document.getElementById('fsStrip');
  if(!w || !strip) return;
  const before = w.offsetHeight;
  w.replaceChildren(img);
  w.classList.add('loaded');
  const d = w.offsetHeight - before;
  if(d && w.offsetTop < strip.scrollTop){
    strip.scrollTop += d;
    auto.pos = strip.scrollTop; auto.lastSet = strip.scrollTop;
  }
}
function renderStrip(m, ch){
  const stage = document.getElementById('fsStage');
  if(!stage) return;
  teardownStrip();
  const total = ch.pageCount || 0;
  const strip = document.createElement('div');
  strip.id = 'fsStrip';
  strip.className = 'fs-strip';
  strip.style.paddingLeft = strip.style.paddingRight = rs.stripMargin + 'px';
  const prevN = chapterNeighbor(m, -1), nextN = chapterNeighbor(m, 1);
  const head = document.createElement('div');
  head.className = 'strip-edge top';
  head.innerHTML = prevN
    ? `<button class="strip-nav" data-strip-nav="-1">↑ Previous chapter<small>${chapterTitle(m, prevN)}</small></button>`
    : `<div class="strip-end">Start of manga</div>`;
  strip.appendChild(head);
  const wraps = [];
  for(let i = 1; i <= total; i++){
    const w = document.createElement('div');
    w.className = 'strip-page';
    w.dataset.p = i;
    w.innerHTML = `<span class="sp-n">${i}</span>`;
    strip.appendChild(w);
    wraps.push(w);
  }
  const foot = document.createElement('div');
  foot.className = 'strip-edge bottom';
  foot.innerHTML = nextN
    ? `<button class="strip-nav" data-strip-nav="1">Next chapter ↓<small>${chapterTitle(m, nextN)}</small></button>`
    : `<div class="strip-end">End of manga</div>`;
  strip.appendChild(foot);
  stage.appendChild(strip);

  const st = { m, ch, wraps, urls: [], io: null, loaded: new Set(), loading: new Set(),
               errShown: false, ignoreUntil: performance.now() + 400, loadPage: null };
  stripState = st;
  st.loadPage = async i => {
    if(st.loaded.has(i) || st.loading.has(i) || i < 1 || i > total) return;
    st.loading.add(i);
    try{
      const file = await getPageFile(m, ch, i);
      if(stripState !== st) return;
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.alt = ''; img.draggable = false; img.src = url;
      try{ await img.decode(); }catch(e){}
      if(stripState !== st){ URL.revokeObjectURL(url); return; }
      st.urls.push(url);
      placeStripImage(st, i, img);
      st.loaded.add(i);
    }catch(err){
      if(stripState === st){
        const w = wraps[i - 1];
        w.classList.add('err');
        w.innerHTML = `<span class="sp-n">Page ${i} failed to load</span>`;
        if(!st.errShown){ st.errShown = true; showToastText(esc(errMsg(err))); }
      }
    }finally{ st.loading.delete(i); }
  };
  st.io = new IntersectionObserver(es => {
    es.forEach(e => { if(e.isIntersecting){ const pg=parseInt(e.target.dataset.p,10); st.loadPage(pg); if(e.intersectionRatio>.45){ m.page=pg; recordReadingPage(m.volume,m.chapter,pg); updateReaderMeta(); setProgress(total?pg/total:0); } } });
  }, { root: strip, rootMargin: '200% 0px' });
  wraps.forEach(w => st.io.observe(w));

  /* restore position */
  const target = wraps[Math.min(wraps.length, Math.max(1, m.page)) - 1];
  strip.scrollTop = target ? target.offsetTop : 0;
  auto.pos = strip.scrollTop; auto.lastSet = strip.scrollTop;
  auto.endAt = 0; auto.anim = null; auto.stepAt = performance.now() + stepIntervalMs();
  setProgress(0);

  strip.addEventListener('scroll', onStripScroll, { passive: true });
  strip.addEventListener('click', e => {
    const nb = e.target.closest('[data-strip-nav]');
    if(nb){ goChapterRel(parseInt(nb.dataset.stripNav, 10)); return; }
    middleTap();
  });
  strip.addEventListener('touchstart', () => { auto.touching = true; }, { passive: true });
  const endTouch = () => { auto.touching = false; auto.holdUntil = performance.now() + 600; };
  strip.addEventListener('touchend', endTouch, { passive: true });
  strip.addEventListener('touchcancel', endTouch, { passive: true });
  strip.addEventListener('wheel', () => { auto.holdUntil = performance.now() + 800; }, { passive: true });
  strip.addEventListener('mousedown', () => { auto.touching = true; });

  if(rs.preload === 'all') stripPreloadAll(st, m.page);
  scheduleStripUpdate();
}
async function stripPreloadAll(st, start){
  const n = st.ch.pageCount || 0;
  const order = [];
  for(let p = start; p <= n; p++) order.push(p);
  for(let p = start - 1; p >= 1; p--) order.push(p);
  let idx = 0;
  const worker = async () => {
    while(stripState === st && idx < order.length) await st.loadPage(order[idx++]);
  };
  await Promise.all([worker(), worker(), worker()]);
}
let stripRaf = 0;
function onStripScroll(){
  if(stripRaf) return;
  stripRaf = requestAnimationFrame(() => { stripRaf = 0; updateStripPosition(); });
}
function scheduleStripUpdate(){ onStripScroll(); }
function updateStripPosition(){
  const st = stripState;
  const strip = document.getElementById('fsStrip');
  const m = currentManga();
  if(!st || !strip || !m) return;
  const max = strip.scrollHeight - strip.clientHeight;
  setProgress(max > 0 ? strip.scrollTop / max : 1);
  if(performance.now() < st.ignoreUntil) return;
  const y = strip.scrollTop + strip.clientHeight * 0.35;
  const wraps = st.wraps;
  if(!wraps.length) return;
  let lo = 0, hi = wraps.length - 1, idx = 0;
  while(lo <= hi){
    const mid = (lo + hi) >> 1;
    if(wraps[mid].offsetTop <= y){ idx = mid; lo = mid + 1; } else hi = mid - 1;
  }
  let page = idx + 1;
  if(max > 0 && strip.scrollTop >= max - 2) page = wraps.length;
  if(page !== m.page){
    m.page = page;
    saveSoon();
    updateReaderMeta();
  }
}

/* ===== Auto-play (never locks manual control) ===== */
const auto = { playing:false, raf:0, timer:0, last:0, pos:0, lastSet:0,
               holdUntil:0, touching:false, anim:null, stepAt:0, endAt:0 };
function overlayOpen(){ return !!document.querySelector('.modal-overlay.show'); }
function stepIntervalMs(){
  const s = document.getElementById('fsStrip');
  const dist = (s ? s.clientHeight : window.innerHeight) * 0.85;
  return Math.max(800, dist / Math.max(10, rs.scrollSpeed) * 1000);
}
function updatePlayBtn(){
  const b = document.getElementById('fsPlay');
  if(!b) return;
  b.classList.toggle('active', auto.playing);
  b.textContent = auto.playing ? '⏸' : '▶';
  b.setAttribute('aria-pressed', auto.playing ? 'true' : 'false');
  b.title = auto.playing ? 'Pause auto-play'
    : (isStrip() ? `Play auto-scroll (${rs.scrollSpeed} px/s)` : `Play auto-advance (${rs.advanceSecs}s)`);
}
function toggleAuto(){ auto.playing ? stopAuto() : startAuto(); }
function startAuto(){
  const m = currentManga();
  if(!m || !curChapter(m)){ showToastText('Nothing to play yet'); return; }
  if(isAtMangaEnd(m)){ showToastText('Already at the end'); return; }
  auto.playing = true;
  updatePlayBtn();
  autoRestart();
  showToastText(isStrip()
    ? `▶ Auto-scroll · ${rs.scrollMode === 'step' ? 'step' : rs.scrollSpeed + ' px/s'}`
    : `▶ Auto-advance · ${rs.advanceSecs}s`);
}
function stopAuto(){
  auto.playing = false;
  cancelAnimationFrame(auto.raf); auto.raf = 0;
  clearTimeout(auto.timer); auto.timer = 0;
  auto.anim = null; auto.touching = false;
  updatePlayBtn();
}
function autoRestart(){
  cancelAnimationFrame(auto.raf); auto.raf = 0;
  clearTimeout(auto.timer); auto.timer = 0;
  auto.anim = null;
  if(!auto.playing) return;
  if(isStrip()){
    const s = document.getElementById('fsStrip');
    auto.pos = s ? s.scrollTop : 0; auto.lastSet = auto.pos;
    auto.last = performance.now();
    auto.stepAt = performance.now() + stepIntervalMs();
    auto.endAt = 0;
    auto.raf = requestAnimationFrame(stripAutoFrame);
  } else scheduleAdvance();
}
/* paged: countdown restarts every time a page is shown (manual or automatic) */
function scheduleAdvance(){
  clearTimeout(auto.timer); auto.timer = 0;
  if(!auto.playing || isStrip()) return;
  auto.timer = setTimeout(advanceTick, Math.max(1, rs.advanceSecs) * 1000);
}
function advanceTick(){
  auto.timer = 0;
  if(!auto.playing || isStrip()) return;
  const m = currentManga();
  if(!m){ stopAuto(); return; }
  if(overlayOpen()){ scheduleAdvance(); return; }
  if(isAtMangaEnd(m)){ stopAuto(); showToastText('⏹ Reached the end'); return; }
  goPage(1);
}
function stripAutoFrame(ts){
  if(!auto.playing || !isStrip()){ auto.raf = 0; return; }
  auto.raf = requestAnimationFrame(stripAutoFrame);
  const s = document.getElementById('fsStrip');
  const dt = Math.min(0.1, Math.max(0, (ts - auto.last) / 1000));
  auto.last = ts;
  if(!s) return;
  const now = performance.now();
  const cur = s.scrollTop;
  /* the user (touch / wheel / scrollbar / momentum) moved it: follow, wait, continue from there */
  if(Math.abs(cur - auto.lastSet) > 1.5){
    auto.pos = cur; auto.lastSet = cur; auto.holdUntil = now + 450; auto.anim = null;
    auto.stepAt = Math.max(auto.stepAt, now + 600);
    return;
  }
  if(auto.touching || now < auto.holdUntil || overlayOpen()){
    auto.pos = cur; auto.lastSet = cur;
    auto.stepAt = Math.max(auto.stepAt, now + 500);
    return;
  }
  const max = s.scrollHeight - s.clientHeight;
  if(rs.scrollMode === 'continuous'){
    auto.pos = Math.min(max, auto.pos + rs.scrollSpeed * dt);
  } else {
    if(!auto.anim && now >= auto.stepAt){
      auto.anim = { from: auto.pos, to: Math.min(max, auto.pos + s.clientHeight * 0.85), t0: now, dur: 650 };
    }
    if(auto.anim){
      const a = auto.anim;
      const t = Math.min(1, (now - a.t0) / a.dur);
      const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      auto.pos = a.from + (a.to - a.from) * e;
      if(t >= 1){ auto.anim = null; auto.stepAt = now + stepIntervalMs(); }
    }
  }
  s.scrollTop = auto.pos;
  auto.lastSet = s.scrollTop;
  if(auto.pos >= max - 2){
    if(!auto.endAt) auto.endAt = now;
    else if(now - auto.endAt > 1500){
      auto.endAt = 0;
      const m = currentManga();
      if(m && chapterNeighbor(m, 1)) goChapterRel(1);
      else { stopAuto(); showToastText('⏹ Reached the end'); }
    }
  } else auto.endAt = 0;
}
window.addEventListener('mouseup', () => {
  if(auto.touching){ auto.touching = false; auto.holdUntil = performance.now() + 600; }
});

/* ===== Reader settings modal ===== */
function rsValue(k){
  if(k === 'dir'){
    const m = currentManga();
    return rs.strip ? 'strip' : (m && m.readingDirection === 'ltr' ? 'ltr' : 'rtl');
  }
  if(k === 'fitMode'){ const m=currentManga(); return m?.fitMode || 'page'; }
  return rs[k];
}
function setDirection(v){
  const m = currentManga();
  if(!m) return;
  if(v === 'strip') rs.strip = true;
  else { rs.strip = false; m.readingDirection = v; }
  saveRS(); save();
  if(!rs.strip && isDouble()) m.page = Math.max(1, spreadStart(m.page));
  lastNavDelta = 0;
  applyReaderSettings();
  loadCurrentPage();
  autoRestart();
}
function applySetting(k, v){
  const m = currentManga();
  if(!m) return;
  if(k === 'dir'){ setDirection(v); return; }
  if(k === 'fitMode'){ m.fitMode=v; save(); applyReaderSettings(); return; }
  rs[k] = v;
  rs = sanitizeRS(rs);
  saveRS();
  switch(k){
    case 'layout':
    case 'offset':
      if(isDouble()) m.page = Math.max(1, spreadStart(m.page));
      save(); lastNavDelta = 0; applyReaderSettings(); loadCurrentPage(); break;
    case 'stripMargin': case 'grey': case 'dim': applyReaderSettings(); break;
    case 'progressPos': applyReaderSettings(); setProgress(lastProgress); break;
    case 'scrollMode': case 'scrollSpeed': case 'advanceSecs': autoRestart(); updatePlayBtn(); break;
    case 'preload':
      preloadDone.clear();
      if(rs.strip) loadCurrentPage(); else prefetchAround(m, curChapter(m), m.page);
      break;
    case 'hideTap': lastMidTap = 0; break;
  }
}

  syncSettings(o);
  o.addEventListener('click', e => {
    if(e.target.closest('[data-rsclose]')){ o.remove(); return; }
    const kb = e.target.closest('[data-k]');
    if(kb){ applySetting(kb.dataset.k, kb.dataset.v); syncSettings(o); return; }
    const sb = e.target.closest('[data-step]');
    if(sb){
      const k = sb.dataset.step;
      applySetting(k, rs[k] + parseInt(sb.dataset.d, 10));
      syncSettings(o); return;
    }
    const rb = e.target.closest('[data-reset]');
    if(rb){
      if(rb.dataset.reset === 'all'){
        const keep = rs.strip;
        rs = { ...RS_DEFAULTS, strip: keep };
        saveRS();
        applyReaderSettings(); setProgress(lastProgress); autoRestart(); loadCurrentPage();
      } else applySetting(rb.dataset.reset, RS_DEFAULTS[rb.dataset.reset]);
      syncSettings(o);
    }
  });
  o.addEventListener('change', e => {
    const c = e.target.closest('input[data-chk]');

  });
  o.addEventListener('input', e => {
